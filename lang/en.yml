    vat_id: "VAT ID (USt-IdNr.) found."
    no_vat_id: "No VAT ID (USt-IdNr.) found. Required if you have one (Nr. 6)."
    register: "Register entry found."
    no_register: "No register entry (HRB, VR, ...) found. Required if registered (Nr. 4)."
    no_email: "The imprint has no email address (Nr. 2)."
    incomplete:
      one: "The imprint may be incomplete: {count} item not found."
