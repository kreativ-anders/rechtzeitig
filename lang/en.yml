# English wording. See de.yml for how patterns work.

locale: en-GB

links:
  imprint:
    - '\bimprint\b'
    - '\blegal (notice|disclosure|information|info)\b'
    - '\bsite notice\b'
  privacy:
    - '\bprivacy\b'
    - '\bdata protection\b'
  terms:
    - '\bterms (and|&) conditions\b'
    - '\bterms of (sale|service|business)\b'
    - '\bgeneral terms\b'
  withdrawal_info:
    - '\bright of withdrawal\b'
    - '\bwithdrawal (policy|instructions?|information)\b'
  cancel:
    - '\bcancel contracts? here\b'
  cancel_similar:
    - '\b(cancel|end|terminate)\b (\w+ ){0,3}(subscription|contract|membership|plan)s?\b'
    - '\bcancell?ation\b'
  withdraw:
    - '\bwithdraw from (the )?contracts?( here)?\b'
  withdraw_similar:
    - '\bwithdraw(al)?( form)?\b'
  consent_accept:
    - '\b(accept|allow|agree)( all)?( cookies)?\b'
    - '\bi agree\b'
  consent_reject:
    - '\b(reject|decline|deny|refuse)( all)?( cookies)?\b'
    - '\b(only )?(necessary|essential|required)( cookies)? only\b'
    - '\bonly (necessary|essential|required)\b'
    - '\bcontinue without (accepting|consent)\b'
  consent_settings:
    - '\b(cookie|privacy|consent|tracking)[- ]?(settings|preferences|options|choices|manager|center|centre)\b'
    - '\b(manage|change|update|edit|withdraw|revoke) (\w+ ){0,2}(cookies|consent|cookie settings|privacy settings)\b'

text:
  cancel_confirm:
    - '\bcancel now\b'
  # Second way of contact in an imprint besides email, § 5 Abs. 1 Nr. 2 DDG.
  withdraw_confirm:
    - '\bconfirm (the )?withdrawal\b'
  contact_form:
    - '\bcontact form\b'
  order_button:
    - '^(order|buy) with obligation to pay$'
    - '^(place )?order (and pay|with obligation to pay)$'
    - '^buy( now)?$'
  order_wrong:
    - '^(place )?order( now)?$'
    - '^(submit|send|complete|confirm) (my )?(order|purchase)$'
  order_generic:
    - '^(continue|next|submit|send|confirm|done|finish)$'
  checkout_payment:
    - '\bpayment (method|option)s?\b'
  checkout_total:
    - '\b(order total|subtotal|grand total|total)\b'
  shop:
    - '\b(add to )?(cart|basket|bag)\b'
    - '\bcheckout\b'
    - '\bbuy( now)?\b'
  vat_included:
    - '\b(incl\.?|including|includes) (\S+ ){0,2}(vat|tax(es)?)\b'
    - '\bvat (included|incl)\b'
  shipping_costs:
    - '\b(plus|excl\.?|excluding|\+) (\S+ )?(shipping|delivery|postage)\b'
    - '\b(shipping|delivery) (costs?|fees?|charges?|rates?)\b'
    - '\bfree (shipping|delivery)\b'
  base_price:
    - '\bunit price\b'
    - '\bprice per (kg|kilogram|litre|liter|100)\b'
  lowest_price:
    - '\blowest price (\S+ ){0,4}(30|thirty) days\b'
    - '\b(last|past|previous) (30|thirty) days\b'
  rrp:
    - '\b(rrp|msrp)\b'
    - '\brecommended retail price\b'
  withdrawal_instruction:
    - '\bright of withdrawal\b'
    - '\bright to withdraw\b'
  model_form:
    - '\bmodel withdrawal form\b'
    - '\bhereby give notice that i\b'
  withdraw_function_hint:
    - '\bwithdrawal function\b'
    - '\bwithdraw (\S+ ){0,3}online\b'
    - '["“]withdraw from (the )?contract["”]'
  controller:
    - '\bcontroller\b'
    - '\bresponsible\b'
  legal_basis:
    - '\blegal basis\b'
    - '\bart(icle)?\.? ?6\b'
  storage_period:
    - '\bretention\b'
    - '\bretain'
    - '\bstorage (period|duration)\b'
    - '\bstored (until|for|as long)\b'
    - '\b(be|is|are) (\w+ ){0,4}deleted\b'
    - '\bafter \d+ (days|weeks|months|years)\b'
  right_access:
    - '\baccess\b'
  right_rectification:
    - '\brectif'
    - '\bcorrect'
  right_erasure:
    - '\berasure\b'
    - '\bdelet'
  right_restriction:
    - '\brestrict'
  right_portability:
    - '\bportab'
    - '\bcopy of (your|the) data\b'
  right_objection:
    - '\bobject(ion)?\b'
  right_complaint:
    - '\bsupervisory authority\b'
    - '\bdata protection authority\b'
  withdraw_consent:
    - '\bwithdraw'
    - '\brevoke\b'
  third_country:
    - '\bthird countr'
    - '\b(usa|united states)\b'
    - '\bu\.s\.'
    - '\bdata privacy framework\b'
    - '\badequacy decision\b'
    - '\bstandard contractual clauses\b'
    - '\boutside (of )?the (eu|european union|eea|european economic area)\b'
  consent_optional:
    - '\bstatistic'
    - '\banalytic'
    - '\bmarketing\b'
    - '\badvertis'
    - '\bpersonali[sz]ation\b'
    - '\bexternal media\b'
  # Confirmation shaming: a refusal worded so that saying no sounds like a loss. Only clear phrases.
  consent_shaming:
    - '\b(no|i don.?t want|i do not want)\b.{0,40}\bbetter (offers?|content|ads|experience|deals|recommendations|prices)\b'
    - '\bi (don.?t|do not) (want to|like to) (save|support)\b'
    - '\bi.?d rather pay (the )?full price\b'
    - '\bi prefer (a )?worse\b'
  # Template data left in an imprint or privacy policy (legal/placeholder-legal-texts). Only words no real
  # provider uses.
  placeholder:
    - '\blorem ipsum\b'
    - '\b(john|jane) doe\b'
    - '\byour (company|business) name\b'
    - '\b123 (main|example|fake) (st|st\.|street|road|ave|avenue)\b'
    - '\[ ?(company name|company|your name|your company|name|full name|address|street|street address|city|zip|zip code|postcode|postal code|country|phone|phone number|e-?mail|e-?mail address|vat id|vat number|date|website|domain|controller) ?\]'
    - '@(example|yourcompany|yourdomain|your-domain|yoursite|your-site)\.(com|org|net)\b'
    - '\(555\) ?\d{3}-\d{4}'
    - '\b555-01\d\d\b'

# Report sentences. Checks return a key and parameters; {name} is replaced by a parameter.
# A value with one/other is picked by the parameter count. Groups are check ids; `common` is shared.
# Every language file must define the same keys (test: src/lang.test.ts).
messages:
  common:
    axe_not_run: "axe-core did not run on any visited page: no page loaded with JavaScript, or axe-core did not finish in time."
    page_imprint: "imprint (Impressum)"
    page_privacy: "privacy policy (Datenschutzerklärung)"
    page_terms: "terms and conditions (AGB)"
    page_withdrawal_info: "withdrawal instructions (Widerrufsbelehrung)"
    no_link: "No link to the {page} on the start page."
    not_loaded: "The {page} link {where} could not be loaded."
    http_error: "The {page} at {where} returns HTTP {status}."
    empty: "The {page} at {where} is almost empty."
    switch_ipinfo-token: "Opt-in: runs only when the secret {secret} is set (input {input}). Without it, nothing is sent to {service}."
    switch_subscriptions: "Only needed when visitors can sign up for subscriptions. Start the scan with subscriptions: true to check it."
    switch_sales: "Only needed when consumers buy or sign contracts on the site. Start the scan with sales: true to check it."
    switch_vulnerabilities: "Vulnerability lookup is turned off (input vulnerabilities: false). Nothing was sent to OSV."
    switch_green-hosting: "Green hosting lookup is turned off (input green-hosting: false). Nothing was sent to the Green Web Foundation."
    no_page: "No {page} to read (see {check})."
    found: "Found the {page} at {where}."
    not_run_url: "Not run: needs a website. Set the input url."
    not_run_repository: "Not run: needs the repository. Run actions/checkout before rechtzeitig."
    no_code: "No source code in a language this check reads (data/code-paths.yml), so nothing to check."
    not_run_module: "Not run: neither its group {module} nor its scope {scope} is in modules ({modules}). Empty modules runs all checks."
    not_run_both_url: "Not run: reads the website and the repository together, and the website is missing. Set the input url."
    not_run_both_repository: "Not run: reads the website and the repository together, and the checkout is missing. Run actions/checkout before rechtzeitig."
    not_run_both_both: "Not run: reads the website and the repository together, and both are missing. Set the input url and run actions/checkout before rechtzeitig."
    lic_no_components: "No production dependencies in the lockfiles."
    lic_none_checked: "No lockfile names licenses ({files}), so nothing was checked. See legal/unknown-licenses."
    lic_unchecked:
      one: "{count} production dependency not checked: {files} name no licenses. See legal/unknown-licenses."
      other: "{count} production dependencies not checked: {files} name no licenses. See legal/unknown-licenses."
  report:
    check: "Check"
    severity: "Severity"
    result: "Result"
    details: "Details"
    findings_only: "Findings only. Passed and skipped checks are in the full report in the artifact rechtzeitig-report."
    no_findings: "No findings. The full report is in the artifact rechtzeitig-report."
    hidden_public: "Details hidden: on a public repository anyone can read this page. Set report-visibility: full to show them, or run rechtzeitig from a private repository."
    scan: "Scan"
    fix: "Fix"
    no_legal_basis: "no legal basis"
    pages: "Pages"
    language: "Language"
    subscriptions: "Subscriptions"
    sales: "Sales"
    "yes": "yes"
    "no": "no"
    visitor: "Visitor: fresh browser, no clicks, no consent given"
    runner: "GitHub-hosted runner (US data center)"
    repository: "Repository: {files} files, {components} components from {lockfiles} lockfile(s), OSV: {osv}"
    not_run: "Not run ({count})"
    not_run_url:
      one: "{count} website check: no url. Set the input url to run it."
      other: "{count} website checks: no url. Set the input url to run them."
    not_run_repository:
      one: "{count} repository check: no checkout. Run actions/checkout before rechtzeitig."
      other: "{count} repository checks: no checkout. Run actions/checkout before rechtzeitig."
    not_run_both_url:
      one: "{count} check of website and repository together: no url. Set the input url to run it."
      other: "{count} checks of website and repository together: no url. Set the input url to run them."
    not_run_both_repository:
      one: "{count} check of website and repository together: no checkout. Run actions/checkout before rechtzeitig."
      other: "{count} checks of website and repository together: no checkout. Run actions/checkout before rechtzeitig."
    not_run_both_both:
      one: "{count} check of website and repository together: no url and no checkout."
      other: "{count} checks of website and repository together: no url and no checkout."
    not_run_module:
      one: "{count} check outside modules: {modules}. Empty modules runs all checks."
      other: "{count} checks outside modules: {modules}. Empty modules runs all checks."
    not_run_switch:
      one: "{count} check: {hint}"
      other: "{count} checks: {hint}"
    not_run_data:
      one: "{count} check ran but found nothing it could read."
      other: "{count} checks ran but found nothing they could read."
    and_more: " and {count} more"
    cov_walk: "File list from a folder walk ({why}): .gitignore was not applied."
    cov_submodules_missing:
      one: "{count} submodule not checked out, its files were not scanned: {names}. Check out with submodules: recursive."
      other: "{count} submodules not checked out, their files were not scanned: {names}. Check out with submodules: recursive."
    cov_submodules:
      one: "{count} submodule scanned: {names}"
      other: "{count} submodules scanned: {names}"
    cov_lfs:
      one: "{count} Git LFS pointer instead of the file: {names}. Check out with lfs: true."
      other: "{count} Git LFS pointers instead of the files: {names}. Check out with lfs: true."
    cov_lockfiles_failed:
      one: "{count} lockfile gave no components: {names}"
      other: "{count} lockfiles gave no components: {names}"
    cov_lockfiles_empty:
      one: "{count} lockfile without components: {names}"
      other: "{count} lockfiles without components: {names}"
    cov_unsupported:
      one: "{count} package file without a parser, not in the SBOM: {names}"
      other: "{count} package files without a parser, not in the SBOM: {names}"
    cov_large:
      one: "{count} file over {limit} MB not read: {names}"
      other: "{count} files over {limit} MB not read: {names}"
    cov_binary:
      one: "{count} binary file not read."
      other: "{count} binary files not read."
    cov_private:
      one: "{count} private package source, named only, never contacted: {names}"
      other: "{count} private package sources, named only, never contacted: {names}"
    reason_large: "too large"
    reason_lfs: "Git LFS pointer"
    reason_binary: "binary"
    reason_invalid: "not readable"
    source_registry: "registry"
    source_git: "git"
    source_replace: "replace"
    disclaimer: "Technical risk hints with the place they were found and the legal basis they relate to. Not legal advice."
    made_by: "by {maker}"
    severity_info: "info"
    severity_low: "low"
    severity_medium: "medium"
    severity_high: "high"
    severity_critical: "critical"
  # ---------- legal
  legal/cancellation-button:
    missing: 'No cancellation button on the start page. The law asks for "Verträge hier kündigen".'
    not_followed: 'Could not follow "{text}" to the cancellation page {where}; the confirmation button "jetzt kündigen" was not checked.'
    not_followed_button: 'Could not follow "{text}" to the cancellation page (a button without a link); the confirmation button "jetzt kündigen" was not checked.'
    no_confirm: '{where} has no confirmation button "jetzt kündigen" (§ 312k Abs. 2 Satz 2 BGB).'
    similar: 'Found "{text}", but the law asks for "Verträge hier kündigen" or equally clear wording.'
    unconfirmed: 'Found "{text}", but could not follow it to the confirmation page.'
    incomplete: 'Found "{text}", but the cancellation page looks incomplete.'
    found: 'Found "{text}".'
  legal/form-privacy-notice:
    no_forms: "No form that asks for personal data."
    form: "{page}: form with {fields}"
    form_to: "{page}: form with {fields}, sends to {host}"
    missing:
      one: "{missing} of {count} form asks for personal data without a privacy notice next to it."
      other: "{missing} of {count} forms ask for personal data without a privacy notice next to them."
    all:
      one: "The form points to the privacy policy."
      other: "All {count} forms point to the privacy policy."
  legal/imprint-details:
