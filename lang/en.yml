# English wording. See de.yml for how patterns work.

locale: en-GB

links:
  imprint:
    - '\bimprint\b'
    - '\blegal (notice|disclosure|information|info)\b'
    - '\bsite notice\b'
  privacy:
    - '\bprivacy\b'
    - '\bdata protection\b'
  cancel:
    - '\bcancel contracts? here\b'
  cancel_similar:
    - '\b(cancel|end|terminate)\b (\w+ ){0,3}(subscription|contract|membership|plan)s?\b'
    - '\bcancell?ation\b'
  withdraw:
    - '\bwithdraw from (the )?contracts?( here)?\b'
  withdraw_similar:
    - '\bwithdraw(al)?( form)?\b'
  consent_accept:
    - '\b(accept|allow|agree)( all)?( cookies)?\b'
    - '\bi agree\b'
  consent_reject:
    - '\b(reject|decline|deny|refuse)( all)?( cookies)?\b'
    - '\b(only )?(necessary|essential|required)( cookies)? only\b'
    - '\bonly (necessary|essential|required)\b'
    - '\bcontinue without (accepting|consent)\b'

text:
  cancel_confirm:
    - '\bcancel now\b'
  # Second way of contact in an imprint besides email, § 5 Abs. 1 Nr. 2 DDG.
  withdraw_confirm:
    - '\bconfirm (the )?withdrawal\b'
  contact_form:
    - '\bcontact form\b'
  controller:
    - '\bcontroller\b'
    - '\bresponsible\b'
  legal_basis:
    - '\blegal basis\b'
    - '\bart(icle)?\.? ?6\b'
  storage_period:
    - '\bretention\b'
    - '\bretain'
    - '\bstorage (period|duration)\b'
    - '\bstored (until|for|as long)\b'
    - '\b(be|is|are) (\w+ ){0,4}deleted\b'
    - '\bafter \d+ (days|weeks|months|years)\b'
  right_access:
    - '\baccess\b'
  right_rectification:
    - '\brectif'
    - '\bcorrect'
  right_erasure:
    - '\berasure\b'
    - '\bdelet'
  right_restriction:
    - '\brestrict'
  right_portability:
    - '\bportab'
    - '\bcopy of (your|the) data\b'
  right_objection:
    - '\bobject(ion)?\b'
  right_complaint:
    - '\bsupervisory authority\b'
    - '\bdata protection authority\b'
  withdraw_consent:
    - '\bwithdraw'
    - '\brevoke\b'
  third_country:
    - '\bthird countr'
    - '\b(usa|united states)\b'
    - '\bu\.s\.'
    - '\bdata privacy framework\b'
    - '\badequacy decision\b'
    - '\bstandard contractual clauses\b'
  consent_optional:
    - '\bstatistic'
    - '\banalytic'
    - '\bmarketing\b'
    - '\badvertis'
    - '\bpersonali[sz]ation\b'
    - '\bexternal media\b'

# Report sentences. Checks return a key and parameters; {name} is replaced by a parameter.
# A value with one/other is picked by the parameter count. Groups are check ids; `common` is shared.
# Every language file must define the same keys (test: src/lang.test.ts).
messages:
  common:
    page_imprint: "imprint (Impressum)"
    page_privacy: "privacy policy (Datenschutzerklärung)"
    no_link: "No link to the {page} on the start page."
    not_loaded: "The {page} link {where} could not be loaded."
    http_error: "The {page} at {where} returns HTTP {status}."
    empty: "The {page} at {where} is almost empty."
    no_page: "No {page} to read (see {check})."
    found: "Found the {page} at {where}."
  # ---------- legal
  legal/cancellation-button:
    not_needed: "Only needed when visitors can sign up for subscriptions. Start the scan with subscriptions: true to check it."
    missing: 'No cancellation button on the start page. The law asks for "Verträge hier kündigen".'
    not_followed: 'Could not follow "{text}" to the cancellation page {where}; the confirmation button "jetzt kündigen" was not checked.'
    not_followed_button: 'Could not follow "{text}" to the cancellation page (a button without a link); the confirmation button "jetzt kündigen" was not checked.'
    no_confirm: '{where} has no confirmation button "jetzt kündigen" (§ 312k Abs. 2 Satz 2 BGB).'
    similar: 'Found "{text}", but the law asks for "Verträge hier kündigen" or equally clear wording.'
    unconfirmed: 'Found "{text}", but could not follow it to the confirmation page.'
    incomplete: 'Found "{text}", but the cancellation page looks incomplete.'
    found: 'Found "{text}".'
  legal/form-privacy-notice:
    no_forms: "No form that asks for personal data."
    form: "{page}: form with {fields}"
    form_to: "{page}: form with {fields}, sends to {host}"
    missing:
      one: "{missing} of {count} form asks for personal data without a privacy notice next to it."
      other: "{missing} of {count} forms ask for personal data without a privacy notice next to them."
    all:
      one: "The form points to the privacy policy."
      other: "All {count} forms point to the privacy policy."
  legal/imprint-details:
    no_address: "No postal address with a German postcode found (Nr. 1)."
    no_second_contact: "No phone number or contact form found. Besides email, a second fast way of contact is required (Nr. 2)."
    vat_id: "VAT ID (USt-IdNr.) found."
    no_vat_id: "No VAT ID (USt-IdNr.) found. Required if you have one (Nr. 6)."
    register: "Register entry found."
    no_register: "No register entry (HRB, VR, ...) found. Required if registered (Nr. 4)."
    no_email: "The imprint has no email address (Nr. 2)."
    incomplete:
      one: "The imprint may be incomplete: {count} item not found."
      other: "The imprint may be incomplete: {count} items not found."
    complete: "Address, email and a second way of contact found in the imprint."
  legal/links-on-all-pages:
    start_only: "Only the start page could be checked."
    page_imprint: "imprint"
    page_privacy: "privacy policy"
    or: "{a} or {b}"
    gap: "{where}: no link to the {pages}"
    gaps:
      one: "{gaps} of {count} page lacks a legal link. Both must be reachable from every page."
      other: "{gaps} of {count} pages lack a legal link. Both must be reachable from every page."
    all:
      one: "Both links found on the page checked."
      other: "Both links found on all {count} pages checked."
  legal/odr-link:
    found: "The EU online dispute resolution platform closed on 20 July 2025. Remove the link and the notice about it."
    none: "No outdated link to the EU dispute platform."
  legal/privacy-policy-details:
    topic_controller: "Controller and contact details (Art. 13(1)(a))"
    topic_legal_basis: "Legal basis of each processing (Art. 13(1)(c))"
    topic_storage_period: "Storage period (Art. 13(2)(a))"
    topic_right_access: "Right of access (Art. 15)"
    topic_right_rectification: "Right to rectification (Art. 16)"
    topic_right_erasure: "Right to erasure (Art. 17)"
    topic_right_restriction: "Right to restriction of processing (Art. 18)"
    topic_right_portability: "Right to data portability (Art. 20)"
    topic_right_objection: "Right to object (Art. 21)"
    topic_withdraw_consent: "Right to withdraw consent (Art. 7(3)), needed if you ask for consent"
    topic_right_complaint: "Right to lodge a complaint with a supervisory authority (Art. 77)"
    missing:
      one: "{missing} of {count} required topic not found."
      other: "{missing} of {count} required topics not found."
    complete:
      one: "{count} required topic found."
      other: "All {count} required topics found."
  legal/withdrawal-button:
    not_needed: "Only needed when consumers buy or sign contracts on the site. Start the scan with sales: true to check it."
    missing: 'No withdrawal function on the start page. Since 19 June 2026 the law asks for "Vertrag widerrufen".'
    not_followed: 'Could not follow "{text}" to the withdrawal page {where}; the confirmation button "Widerruf bestätigen" was not checked.'
    not_followed_button: 'Could not follow "{text}" to the withdrawal page (a button without a link); the confirmation button "Widerruf bestätigen" was not checked.'
    no_confirm: '{where} has no confirmation button "Widerruf bestätigen" (§ 356a Abs. 3 BGB).'
    similar: 'Found "{text}", but the law asks for "Vertrag widerrufen" or equally clear wording.'
    unconfirmed: 'Found "{text}", but could not follow it to the confirmation page.'
    incomplete: 'Found "{text}", but the withdrawal page looks incomplete.'
    found: 'Found "{text}".'

  # ---------- privacy
  privacy/consent-preselected: {}
  privacy/consent-reject: {}
  privacy/cookies-before-consent: {}
  privacy/third-country: {}
  privacy/third-parties-before-consent: {}
  privacy/vendors-in-privacy-policy: {}

  # ---------- security
  security/cookie-flags: {}
  security/email-dns: {}
  security/error-disclosure: {}
  security/exposed-files: {}
  security/headers: {}
  security/host-variants: {}
  security/https: {}
  security/mixed-content: {}
  security/tls: {}

  # ---------- accessibility
  accessibility/page-language: {}

  # ---------- sustainability
  sustainability/content-without-js: {}
  sustainability/legal-pages-without-js: {}

  # ---------- repo
  repo/actions-pinning: {}
  repo/database-rules: {}
  repo/dependency-updates: {}
  repo/env-files: {}
  repo/licenses: {}
  repo/sbom: {}
  repo/secrets:
    secret: "{name} ({start}… ({length} chars))"
    secrets:
      one: "{count} secret found. Revoke it, then remove it from the code and the git history."
      other: "{count} secrets found. Revoke them, then remove them from the code and the git history."
    public_keys:
      one: "{count} key found that may be public by design. Check that it is restricted."
      other: "{count} keys found that may be public by design. Check that each is restricted."
    none: "No secrets found in tracked files."
  repo/vulnerabilities: {}
