    wrong: '{where}: order button "{text}" on the order summary. The law asks for "zahlungspflichtig bestellen" or equally clear wording; otherwise no contract is formed.'
    wrong_form: '{where}: "{text}" in a form that asks for personal data. If this is the last step of the order, the law asks for "zahlungspflichtig bestellen" or equally clear wording.'
    generic: '{where}: the order summary only has the button "{text}". If this is the last step, the law asks for "zahlungspflichtig bestellen" or equally clear wording.'
    unrecognized: "{where}: a page with payment method and total, but no order button recognized."
    wrong_found:
