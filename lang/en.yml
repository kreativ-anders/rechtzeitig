# English wording. See de.yml for how patterns work.

locale: en-GB

links:
  imprint:
    - '\bimprint\b'
    - '\blegal (notice|disclosure|information|info)\b'
    - '\bsite notice\b'
  privacy:
    - '\bprivacy\b'
    - '\bdata protection\b'
  cancel:
    - '\bcancel contracts? here\b'
  cancel_similar:
    - '\b(cancel|end|terminate)\b (\w+ ){0,3}(subscription|contract|membership|plan)s?\b'
    - '\bcancell?ation\b'
  withdraw:
    - '\bwithdraw from (the )?contracts?( here)?\b'
  withdraw_similar:
    - '\bwithdraw(al)?( form)?\b'
  consent_accept:
    - '\b(accept|allow|agree)( all)?( cookies)?\b'
    - '\bi agree\b'
  consent_reject:
    - '\b(reject|decline|deny|refuse)( all)?( cookies)?\b'
    - '\b(only )?(necessary|essential|required)( cookies)? only\b'
    - '\bonly (necessary|essential|required)\b'
    - '\bcontinue without (accepting|consent)\b'

text:
  cancel_confirm:
    - '\bcancel now\b'
  # Second way of contact in an imprint besides email, § 5 Abs. 1 Nr. 2 DDG.
  withdraw_confirm:
    - '\bconfirm (the )?withdrawal\b'
  contact_form:
    - '\bcontact form\b'
  controller:
    - '\bcontroller\b'
    - '\bresponsible\b'
  legal_basis:
    - '\blegal basis\b'
    - '\bart(icle)?\.? ?6\b'
  storage_period:
    - '\bretention\b'
    - '\bretain'
    - '\bstorage (period|duration)\b'
    - '\bstored (until|for|as long)\b'
    - '\b(be|is|are) (\w+ ){0,4}deleted\b'
    - '\bafter \d+ (days|weeks|months|years)\b'
  right_access:
    - '\baccess\b'
  right_rectification:
    - '\brectif'
    - '\bcorrect'
  right_erasure:
    - '\berasure\b'
    - '\bdelet'
  right_restriction:
    - '\brestrict'
  right_portability:
    - '\bportab'
    - '\bcopy of (your|the) data\b'
  right_objection:
    - '\bobject(ion)?\b'
  right_complaint:
    - '\bsupervisory authority\b'
    - '\bdata protection authority\b'
  withdraw_consent:
    - '\bwithdraw'
    - '\brevoke\b'
  third_country:
    - '\bthird countr'
    - '\b(usa|united states)\b'
    - '\bu\.s\.'
    - '\bdata privacy framework\b'
    - '\badequacy decision\b'
    - '\bstandard contractual clauses\b'
  consent_optional:
    - '\bstatistic'
    - '\banalytic'
    - '\bmarketing\b'
    - '\badvertis'
    - '\bpersonali[sz]ation\b'
    - '\bexternal media\b'

# Report sentences. Checks return a key and parameters; {name} is replaced by a parameter.
# A value with one/other is picked by the parameter count. Groups are check ids; `common` is shared.
# Every language file must define the same keys (test: src/lang.test.ts).
messages:
  common:
    page_imprint: "imprint (Impressum)"
    page_privacy: "privacy policy (Datenschutzerklärung)"
    no_link: "No link to the {page} on the start page."
    not_loaded: "The {page} link {where} could not be loaded."
    http_error: "The {page} at {where} returns HTTP {status}."
    empty: "The {page} at {where} is almost empty."
    no_page: "No {page} to read (see {check})."
    found: "Found the {page} at {where}."
  # ---------- legal
  legal/cancellation-button: {}
  legal/form-privacy-notice: {}
  legal/imprint-details: {}
  legal/links-on-all-pages: {}
  legal/odr-link: {}
  legal/privacy-policy-details: {}
  legal/withdrawal-button: {}

  # ---------- privacy
  privacy/consent-preselected: {}
  privacy/consent-reject: {}
  privacy/cookies-before-consent: {}
  privacy/third-country: {}
  privacy/third-parties-before-consent: {}
  privacy/vendors-in-privacy-policy: {}

  # ---------- security
  security/cookie-flags:
    none: "No cookies set without login."
    secure_samesite: "Secure (required with SameSite=None)"
    two_flags: "{first}, {second}"
    missing: "{name}: missing {flags}"
    missing_foreign: "{name}: missing {flags} (set by another site, the site cannot change it)"
    lack_flags:
      one: "{count} of {total} cookies lacks security flags."
      other: "{count} of {total} cookies lack security flags."
    only_foreign: "Only cookies of other sites lack security flags."
    all_set:
      one: "{count} cookie has the expected flags."
      other: "All {count} cookies have the expected flags."
  security/email-dns:
    not_checked: "DNS was not checked."
    no_spf: "No SPF record. List your mail servers."
    no_spf_no_mail: 'No SPF record. The domain sends no mail, so publish "v=spf1 -all".'
    open_spf: 'SPF allows every server to send mail ("{spf}"). End it with "-all" or "~all".'
    no_dmarc: 'No DMARC record at _dmarc.{domain}. Start with "v=DMARC1; p=quarantine".'
    dmarc_none: "DMARC only monitors (p=none). Mail that fails checks is still delivered."
    spoofable: "Others can send email in the name of {domain}."
    set: "SPF and DMARC are set."
  security/error-disclosure:
    leaks: "Error pages show technical details that help attackers."
    versions: "Response headers reveal software and versions."
    none: "Error pages and headers reveal no technical details."
  security/exposed-files:
    exposed:
      one: "{count} private file can be downloaded. Remove it or block it in the web server."
      other: "{count} private files can be downloaded. Remove them or block them in the web server."
    none:
      one: "The {count} common private path checked (.env, .git, backups, phpinfo) is not public."
      other: "None of {count} common private paths (.env, .git, backups, phpinfo) is public."
  security/headers:
    frame: "X-Frame-Options or CSP frame-ancestors"
    frame_meta: "X-Frame-Options or CSP frame-ancestors (browsers ignore frame-ancestors in <meta>)"
    from_meta: "Set as <meta>: {names}"
    missing:
      one: "{count} security header missing."
      other: "{count} security headers missing."
    all_set: "All common security headers are set."
  security/host-variants:
    no_variant: "The other address variant does not exist."
    no_answer: "{host} exists in DNS but does not answer over HTTPS ({error})."
    http_error: "{host} answers with HTTP {status}."
    no_redirect: "{host} shows the site without redirecting to {target}."
    redirects: "{host} redirects to {target}."
  security/https:
    no_https: "The site is not served over HTTPS."
    not_checked: "Plain HTTP was not checked."
    no_http: "Served over HTTPS. Plain HTTP is not offered."
    redirects: "Served over HTTPS. Plain HTTP redirects to HTTPS."
    no_redirect: "Plain HTTP answers with {status} instead of redirecting to HTTPS."
  security/mixed-content:
    no_https: "The site does not use HTTPS (see security/https)."
    on_page: "{url} on {page}"
    insecure:
      one: "{count} resource loads over plain HTTP."
      other: "{count} resources load over plain HTTP."
    all_https: "All resources load over HTTPS."
  security/tls:
    none: "No TLS connection to check."
    failed: "TLS connection failed: {error}"
    untrusted: "The certificate is not trusted."
    untrusted_error: "The certificate is not trusted: {error}"
    outdated: "The server uses {protocol}, which is outdated. Use TLS 1.2 or 1.3."
    expires:
      one: "The certificate expires in {count} day, on {date}."
      other: "The certificate expires in {count} days, on {date}."
    valid: "{protocol}, certificate valid until {date}."

  # ---------- accessibility
  accessibility/page-language:
    missing: "The start page has no <html lang> attribute. Screen readers then have to guess the language."
    mismatch: 'The page declares lang="{lang}", but the scan used {languages}. Pick the matching language when you start the scan.'
    declared: 'The page declares lang="{lang}".'

  # ---------- sustainability
  sustainability/content-without-js:
    shows:
      one: "Without JavaScript the start page shows {shown} of {count} character."
      other: "Without JavaScript the start page shows {shown} of {count} characters."
    shows_only:
      one: "Without JavaScript the start page shows only {shown} of {count} character."
      other: "Without JavaScript the start page shows only {shown} of {count} characters."
    render_html: "Render content as HTML on the server or at build time. It then works for every visitor and loads faster."
  sustainability/legal-pages-without-js:
    label_imprint: "Imprint"
    label_privacy: "Privacy policy"
    link_needs_js: "{page}: the link only appears with JavaScript."
    no_text: "{page}: {url} shows no text without JavaScript."
    no_links: "No imprint or privacy policy link found (see legal/*)."
    needs_js: "Mandatory information needs JavaScript. Visitors without it, and many crawlers, cannot find it."
    readable: "Both are linked and readable without JavaScript."

  # ---------- repo
  repo/actions-pinning: {}
  repo/database-rules: {}
  repo/dependency-updates: {}
  repo/env-files: {}
  repo/licenses: {}
  repo/sbom: {}
  repo/secrets:
    secret: "{name} ({start}… ({length} chars))"
    secrets:
      one: "{count} secret found. Revoke it, then remove it from the code and the git history."
      other: "{count} secrets found. Revoke them, then remove them from the code and the git history."
    public_keys:
      one: "{count} key found that may be public by design. Check that it is restricted."
      other: "{count} keys found that may be public by design. Check that each is restricted."
    none: "No secrets found in tracked files."
  repo/vulnerabilities: {}
