# English wording. See de.yml for how patterns work.

locale: en-GB

links:
  imprint:
    - '\bimprint\b'
    - '\blegal (notice|disclosure|information|info)\b'
    - '\bsite notice\b'
  privacy:
    - '\bprivacy\b'
    - '\bdata protection\b'
  cancel:
    - '\bcancel contracts? here\b'
  cancel_similar:
    - '\b(cancel|end|terminate)\b (\w+ ){0,3}(subscription|contract|membership|plan)s?\b'
    - '\bcancell?ation\b'
  withdraw:
    - '\bwithdraw from (the )?contracts?( here)?\b'
  withdraw_similar:
    - '\bwithdraw(al)?( form)?\b'
  consent_accept:
    - '\b(accept|allow|agree)( all)?( cookies)?\b'
    - '\bi agree\b'
  consent_reject:
    - '\b(reject|decline|deny|refuse)( all)?( cookies)?\b'
    - '\b(only )?(necessary|essential|required)( cookies)? only\b'
    - '\bonly (necessary|essential|required)\b'
    - '\bcontinue without (accepting|consent)\b'

text:
  cancel_confirm:
    - '\bcancel now\b'
  # Second way of contact in an imprint besides email, § 5 Abs. 1 Nr. 2 DDG.
  withdraw_confirm:
    - '\bconfirm (the )?withdrawal\b'
  contact_form:
    - '\bcontact form\b'
  controller:
    - '\bcontroller\b'
    - '\bresponsible\b'
  legal_basis:
    - '\blegal basis\b'
    - '\bart(icle)?\.? ?6\b'
  storage_period:
    - '\bretention\b'
    - '\bretain'
    - '\bstorage (period|duration)\b'
    - '\bstored (until|for|as long)\b'
    - '\b(be|is|are) (\w+ ){0,4}deleted\b'
    - '\bafter \d+ (days|weeks|months|years)\b'
  right_access:
    - '\baccess\b'
  right_rectification:
    - '\brectif'
    - '\bcorrect'
  right_erasure:
    - '\berasure\b'
    - '\bdelet'
  right_restriction:
    - '\brestrict'
  right_portability:
    - '\bportab'
    - '\bcopy of (your|the) data\b'
  right_objection:
    - '\bobject(ion)?\b'
  right_complaint:
    - '\bsupervisory authority\b'
    - '\bdata protection authority\b'
  withdraw_consent:
    - '\bwithdraw'
    - '\brevoke\b'
  third_country:
    - '\bthird countr'
    - '\b(usa|united states)\b'
    - '\bu\.s\.'
    - '\bdata privacy framework\b'
    - '\badequacy decision\b'
    - '\bstandard contractual clauses\b'
  consent_optional:
    - '\bstatistic'
    - '\banalytic'
    - '\bmarketing\b'
    - '\badvertis'
    - '\bpersonali[sz]ation\b'
    - '\bexternal media\b'

# Report sentences. Checks return a key and parameters; {name} is replaced by a parameter.
# A value with one/other is picked by the parameter count. Groups are check ids; `common` is shared.
# Every language file must define the same keys (test: src/lang.test.ts).
messages:
  common:
    page_imprint: "imprint (Impressum)"
    page_privacy: "privacy policy (Datenschutzerklärung)"
    no_link: "No link to the {page} on the start page."
    not_loaded: "The {page} link {where} could not be loaded."
    http_error: "The {page} at {where} returns HTTP {status}."
    empty: "The {page} at {where} is almost empty."
    no_page: "No {page} to read (see {check})."
    found: "Found the {page} at {where}."
  # ---------- legal
  legal/cancellation-button: {}
  legal/form-privacy-notice: {}
  legal/imprint-details: {}
  legal/links-on-all-pages: {}
  legal/odr-link: {}
  legal/privacy-policy-details: {}
  legal/withdrawal-button: {}

  # ---------- privacy
  privacy/consent-preselected: {}
  privacy/consent-reject: {}
  privacy/cookies-before-consent: {}
  privacy/third-country: {}
  privacy/third-parties-before-consent: {}
  privacy/vendors-in-privacy-policy: {}

  # ---------- security
  security/cookie-flags: {}
  security/email-dns: {}
  security/error-disclosure: {}
  security/exposed-files: {}
  security/headers: {}
  security/host-variants: {}
  security/https: {}
  security/mixed-content: {}
  security/tls: {}

  # ---------- accessibility
  accessibility/page-language: {}

  # ---------- sustainability
  sustainability/content-without-js: {}
  sustainability/legal-pages-without-js: {}

  # ---------- repo
  repo/actions-pinning:
    no_workflows: "No GitHub workflows."
    unpinned:
      one: "{count} action uses a tag instead of a commit SHA. A moved tag can change the code that runs."
      other: "{count} actions use a tag instead of a commit SHA. A moved tag can change the code that runs."
    pinned: "All actions are pinned to a commit SHA."
  repo/database-rules:
    nothing: "No Supabase migrations or Firebase rules in the repository."
    no_rls: 'Supabase table "{table}" has no row level security.'
    open_rules: 'Allows access for everyone ("if true").'
    test_mode: 'In test mode: everyone has access until the date in "request.time < timestamp.date(...)".'
    open_data: "Data can be read or changed by anyone with the public key."
    open_policies:
      one: '{count} Supabase policy uses "using (true)" or "with check (true)". Check that this data is meant to be public.'
      other: '{count} Supabase policies use "using (true)" or "with check (true)". Check that this data is meant to be public.'
    secured:
      one: "{count} Supabase table with row level security{rules}."
      other: "{count} Supabase tables with row level security{rules}."
    rule_files:
      one: ", {count} Firebase rule file without open access"
      other: ", {count} Firebase rule files without open access"
  repo/dependency-updates:
    no_components: "No locked dependencies."
    renovate: "Renovate keeps dependencies up to date."
    dependabot: "Dependabot covers {ecosystems}."
    dependabot_missing: "Dependabot does not cover {ecosystems}."
    add_ecosystem: 'Add package-ecosystem "{name}".'
    scan_only: "Vulnerabilities are scanned, but no tool opens update pull requests."
    unwatched: "Nothing watches the dependencies for new vulnerabilities. Add Dependabot or Renovate."
    add_dependabot: "Add .github/dependabot.yml with one entry per ecosystem: {entries}."
  repo/env-files:
    committed:
      one: "{count} .env file is committed. Its values are in the git history."
      other: "{count} .env files are committed. Their values are in the git history."
    not_ignored: '.gitignore does not ignore .env. Add ".env" so local secrets are not committed by accident.'
    none: "No .env file is committed."
  repo/licenses:
    commons_clause: 'Project: {project}. GPL-3.0 § 7 lets recipients remove "further restrictions", so the Commons Clause may not hold.'
    restricted: "{name}@{version}: {license}. Restricts use, often commercial use."
    agpl: "{name}@{version}: {license}. AGPL also applies when you only offer the software over a network."
    gpl: "{name}@{version}: {license}. If you ship it (app, library, browser bundle), the whole work must be under the GPL{not}."
    not_project: ", not {project}"
    no_project_license: "The project has no license: all rights reserved. Fine for private code."
    unknown:
      one: "{count} production dependency without a license in the lockfile: {names}"
      other: "{count} production dependencies without a license in the lockfile: {names}"
    questions:
      one: "{count} license question to clear."
      other: "{count} license questions to clear."
    unknown_licenses: "No conflicts found{with}, but some licenses are unknown."
    with_project: " with {project}"
    no_conflicts: "No conflicts with {project}{counted}."
    counted:
      one: " in {count} licensed component"
      other: " in {count} licensed components"
  repo/sbom:
    no_manifests: "No package manifests in the repository."
    unlocked:
      one: "{count} manifest without a lockfile. Installed versions can change between builds."
      other: "{count} manifests without a lockfile. Installed versions can change between builds."
    summary:
      one: "{count} component from {lockfiles}, written to rechtzeitig-sbom.cdx.json."
      other: "{count} components from {lockfiles}, written to rechtzeitig-sbom.cdx.json."
    lockfiles:
      one: "{count} lockfile"
      other: "{count} lockfiles"
  repo/secrets:
    secret: "{name} ({start}… ({length} chars))"
    secrets:
      one: "{count} secret found. Revoke it, then remove it from the code and the git history."
      other: "{count} secrets found. Revoke them, then remove them from the code and the git history."
    public_keys:
      one: "{count} key found that may be public by design. Check that it is restricted."
      other: "{count} keys found that may be public by design. Check that each is restricted."
    none: "No secrets found in tracked files."
  repo/vulnerabilities:
    no_components: "No locked dependencies to check."
    lookup_off: "Vulnerability lookup is turned off (input vulnerabilities: false). Nothing was sent to OSV."
    osv_error: "Could not query OSV: {error}"
    none:
      one: "No known vulnerabilities in {count} component."
      other: "No known vulnerabilities in {count} components."
    issue: "{name}@{version}{dev}: {id}{severity}.{summary}{fixed}"
    dev: " (dev)"
    fixed: " Fixed in {version}."
    found:
      one: "{count} known vulnerability, {serious} high or critical in production dependencies.{partial}"
      other: "{count} known vulnerabilities, {serious} high or critical in production dependencies.{partial}"
    partial:
      one: " OSV sent details for {got} of {count} issue; the others have no severity here."
      other: " OSV sent details for {got} of {count} issues; the others have no severity here."
