# English wording. See de.yml for how patterns work.

locale: en-GB

links:
  imprint:
    - '\bimprint\b'
    - '\blegal (notice|disclosure|information|info)\b'
    - '\bsite notice\b'
  privacy:
    - '\bprivacy\b'
    - '\bdata protection\b'
  cancel:
    - '\bcancel contracts? here\b'
  cancel_similar:
    - '\b(cancel|end|terminate)\b (\w+ ){0,3}(subscription|contract|membership|plan)s?\b'
    - '\bcancell?ation\b'
  withdraw:
    - '\bwithdraw from (the )?contracts?( here)?\b'
  withdraw_similar:
    - '\bwithdraw(al)?( form)?\b'
  consent_accept:
    - '\b(accept|allow|agree)( all)?( cookies)?\b'
    - '\bi agree\b'
  consent_reject:
    - '\b(reject|decline|deny|refuse)( all)?( cookies)?\b'
    - '\b(only )?(necessary|essential|required)( cookies)? only\b'
    - '\bonly (necessary|essential|required)\b'
    - '\bcontinue without (accepting|consent)\b'

text:
  cancel_confirm:
    - '\bcancel now\b'
  # Second way of contact in an imprint besides email, § 5 Abs. 1 Nr. 2 DDG.
  withdraw_confirm:
    - '\bconfirm (the )?withdrawal\b'
  contact_form:
    - '\bcontact form\b'
  controller:
    - '\bcontroller\b'
    - '\bresponsible\b'
  legal_basis:
    - '\blegal basis\b'
    - '\bart(icle)?\.? ?6\b'
  storage_period:
    - '\bretention\b'
    - '\bretain'
    - '\bstorage (period|duration)\b'
    - '\bstored (until|for|as long)\b'
    - '\b(be|is|are) (\w+ ){0,4}deleted\b'
    - '\bafter \d+ (days|weeks|months|years)\b'
  right_access:
    - '\baccess\b'
  right_rectification:
    - '\brectif'
    - '\bcorrect'
  right_erasure:
    - '\berasure\b'
    - '\bdelet'
  right_restriction:
    - '\brestrict'
  right_portability:
    - '\bportab'
    - '\bcopy of (your|the) data\b'
  right_objection:
    - '\bobject(ion)?\b'
  right_complaint:
    - '\bsupervisory authority\b'
    - '\bdata protection authority\b'
  withdraw_consent:
    - '\bwithdraw'
    - '\brevoke\b'
  third_country:
    - '\bthird countr'
    - '\b(usa|united states)\b'
    - '\bu\.s\.'
    - '\bdata privacy framework\b'
    - '\badequacy decision\b'
    - '\bstandard contractual clauses\b'
  consent_optional:
    - '\bstatistic'
    - '\banalytic'
    - '\bmarketing\b'
    - '\badvertis'
    - '\bpersonali[sz]ation\b'
    - '\bexternal media\b'

# Report sentences. Checks return a key and parameters; {name} is replaced by a parameter.
# A value with one/other is picked by the parameter count. Groups are check ids; `common` is shared.
# Every language file must define the same keys (test: src/lang.test.ts).
messages:
  common:
    page_imprint: "imprint (Impressum)"
    page_privacy: "privacy policy (Datenschutzerklärung)"
    no_link: "No link to the {page} on the start page."
    not_loaded: "The {page} link {where} could not be loaded."
    http_error: "The {page} at {where} returns HTTP {status}."
    empty: "The {page} at {where} is almost empty."
    no_page: "No {page} to read (see {check})."
    found: "Found the {page} at {where}."
  # ---------- legal
  legal/cancellation-button: {}
  legal/form-privacy-notice: {}
  legal/imprint-details: {}
  legal/links-on-all-pages: {}
  legal/odr-link: {}
  legal/privacy-policy-details: {}
  legal/withdrawal-button: {}

  # ---------- privacy
  privacy/consent-preselected:
    no_categories: "No optional cookie categories found on the start page."
    preselected:
      one: "An optional category is ticked before the visitor chooses."
      other: "Optional categories are ticked before the visitor chooses."
    unticked:
      one: "{count} optional category is unticked."
      other: "{count} optional categories are unticked."
  privacy/consent-reject:
    no_banner: "No consent banner found on the start page."
    no_reject: "The banner offers \"{accept}\" but no way to reject on the same layer. Rejecting must be as easy as accepting."
    both: "The banner offers \"{accept}\" and \"{reject}\"."
  privacy/cookies-before-consent:
    tracking_cookie: "{name} ({domain}, set on {page}): tracking cookie of {vendor}"
    third_party_cookie: "{name} ({domain}, set on {page}): third-party cookie"
    own_cookie: "{name} ({domain}, set on {page})"
    storage: "localStorage: {key}"
    tracking:
      one: "{count} tracking cookie set before consent."
      other: "{count} tracking cookies set before consent."
    third_party:
      one: "{count} third-party cookie set before consent."
      other: "{count} third-party cookies set before consent."
    review:
      one: "{count} cookie or storage entry set before consent. Without consent, only strictly necessary ones are allowed."
      other: "{count} cookies or storage entries set before consent. Without consent, only strictly necessary ones are allowed."
    none: "No cookies or local storage before consent."
  privacy/third-country:
    country_unknown: "Country unknown for {names}. Set the ipinfo-token input to look it up."
    no_services: "No third-party service contacted."
    all_unknown:
      one: "Country unknown for the only third-party service; transfers outside the EU/EEA could not be checked."
      other: "Country unknown for all {count} third-party services; transfers outside the EU/EEA could not be checked."
    none_outside: "No service outside the EU/EEA detected."
    covered: "The privacy policy covers transfers outside the EU/EEA."
    not_covered:
      one: "{count} service outside the EU/EEA, but the privacy policy does not mention third countries."
      other: "{count} services outside the EU/EEA, but the privacy policy does not mention third countries."
  privacy/third-parties-before-consent:
    service: "{name} ({hosts}) on {pages}."
    service_advice: "{name} ({hosts}) on {pages}. {advice}"
    consent_required: "Loaded before consent: {names}. Each visit sends the visitor's IP address to them."
    check_basis: "Contacted before consent: {names}. Check the legal basis and name them in the privacy policy."
    none: "Only the site's own servers are contacted before consent."
  privacy/vendors-in-privacy-policy:
    no_services: "The site uses no third-party services before consent."
    missing:
      one: "The privacy policy does not mention {missing} of {count} service the site uses."
      other: "The privacy policy does not mention {missing} of {count} services the site uses."
    all:
      one: "The {count} service is mentioned in the privacy policy."
      other: "All {count} services are mentioned in the privacy policy."

  # ---------- security
  security/cookie-flags: {}
  security/email-dns: {}
  security/error-disclosure: {}
  security/exposed-files: {}
  security/headers: {}
  security/host-variants: {}
  security/https: {}
  security/mixed-content: {}
  security/tls: {}

  # ---------- accessibility
  accessibility/page-language: {}

  # ---------- sustainability
  sustainability/content-without-js: {}
  sustainability/legal-pages-without-js: {}

  # ---------- repo
  repo/actions-pinning: {}
  repo/database-rules: {}
  repo/dependency-updates: {}
  repo/env-files: {}
  repo/licenses: {}
  repo/sbom: {}
  repo/secrets:
    secret: "{name} ({start}… ({length} chars))"
    secrets:
      one: "{count} secret found. Revoke it, then remove it from the code and the git history."
      other: "{count} secrets found. Revoke them, then remove them from the code and the git history."
    public_keys:
      one: "{count} key found that may be public by design. Check that it is restricted."
      other: "{count} keys found that may be public by design. Check that each is restricted."
    none: "No secrets found in tracked files."
  repo/vulnerabilities: {}
