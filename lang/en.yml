    topic_right_erasure: "Right to erasure (Art. 17)"
    topic_right_restriction: "Right to restriction of processing (Art. 18)"
    topic_right_portability: "Right to data portability (Art. 20)"
    topic_right_objection: "Right to object (Art. 21)"
    topic_withdraw_consent: "Right to withdraw consent (Art. 7(3)), needed if you ask for consent"
    topic_right_complaint: "Right to lodge a complaint with a supervisory authority (Art. 77)"
    missing:
      one: "{missing} of {count} required topic not found."
      other: "{missing} of {count} required topics not found."
    complete:
      one: "{count} required topic found."
      other: "All {count} required topics found."
  legal/withdrawal-button:
