      one: "{count} Action nutzt ein Tag statt eines Commit-SHA. Ein verschobenes Tag kann den ausgeführten Code ändern."
      other: "{count} Actions nutzen ein Tag statt eines Commit-SHA. Ein verschobenes Tag kann den ausgeführten Code ändern."
    pinned: "Alle Actions sind auf einen Commit-SHA festgelegt."
  repo/database-rules:
    nothing: "Keine Supabase-Migrationen oder Firebase-Regeln im Repository."
    no_rls: "Supabase-Tabelle „{table}“ hat keine Row Level Security."
    open_rules: "Erlaubt allen den Zugriff („if true“)."
    test_mode: "Im Testmodus: alle haben Zugriff bis zum Datum in „request.time < timestamp.date(...)“."
    open_data: "Daten können von allen mit dem öffentlichen Schlüssel gelesen oder geändert werden."
    open_policies:
      one: "{count} Supabase-Policy nutzt „using (true)“ oder „with check (true)“. Prüfen, ob diese Daten öffentlich sein sollen."
      other: "{count} Supabase-Policies nutzen „using (true)“ oder „with check (true)“. Prüfen, ob diese Daten öffentlich sein sollen."
    secured:
      one: "{count} Supabase-Tabelle mit Row Level Security{rules}."
      other: "{count} Supabase-Tabellen mit Row Level Security{rules}."
    rule_files:
      one: ", {count} Firebase-Regeldatei ohne offenen Zugriff"
      other: ", {count} Firebase-Regeldateien ohne offenen Zugriff"
  repo/dependency-updates:
    no_components: "Keine Abhängigkeiten mit Lockfile."
    renovate: "Renovate hält die Abhängigkeiten aktuell."
    dependabot: "Dependabot deckt {ecosystems} ab."
    dependabot_missing: "Dependabot deckt {ecosystems} nicht ab."
    add_ecosystem: "package-ecosystem „{name}“ ergänzen."
