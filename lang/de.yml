# German wording.
#
# Patterns are regular expressions, matched case-insensitively against normalized text:
# lowercase, ä→ae ö→oe ü→ue ß→ss, single spaces. So write "kuendigen", not "kündigen".
# Every language file must define the same keys (test: src/lang.test.ts).

locale: de-DE

# Labels of links and buttons. Link labels include the URL path, so "/impressum" matches too.
# The crawler opens every link that matches one of these.
links:
  imprint:
    - '\bimpressum\b'
    - '\banbieterkennzeichnung\b'
  privacy:
    - '\bdatenschutz(erklaerung|hinweise?|information(en)?|richtlinie|bestimmungen)?\b'
  # General terms and conditions (AGB), § 312i Abs. 1 Satz 1 Nr. 4 BGB. Read with sales: true.
  terms:
    - '\bagb\b'
    - '\b(allgemeine )?(geschaefts|verkaufs|liefer)bedingungen\b'
  # Withdrawal instructions, Art. 246a § 1 Abs. 2 EGBGB. Read with sales: true.
  withdrawal_info:
    - '\bwiderrufsbelehrung(en)?\b'
    - '\bwiderrufsrecht\b'
    - '\bwiderrufsinformation(en)?\b'
  # Wording required by § 312k Abs. 2 BGB.
  cancel:
    - '\bvertraege (hier )?kuendigen\b'
  # Means the same, but is not as unambiguous as the law asks for.
  cancel_similar:
    - '\b(abo|abonnement|vertrag|mitgliedschaft|tarif|paket)\w* (\w+ ){0,3}(kuendigen|beenden|aufloesen|stornieren)\b'
    - '\b(kuendigen|beenden)\b (\w+ ){0,3}(abo|abonnement|vertrag|mitgliedschaft)'
    - '\bkuendigung(sbutton|sformular|sseite)?\b'
  # Wording required by § 356a Abs. 1 BGB (withdrawal function, since 19 June 2026).
  withdraw:
    - '\bvertrag (hier )?widerrufen\b'
    - '\bvertraege (hier )?widerrufen\b'
  # Means the same, but is not as unambiguous. Excludes "Widerrufsbelehrung".
  withdraw_similar:
    - '\bwiderruf(en|sformular|sbutton|sfunktion)?\b'
  # Buttons of a consent banner.
  consent_accept:
    - '\b(alle )?(akzeptieren|annehmen|zustimmen|erlauben)\b'
    - '\beinverstanden\b'
    - '\balle (cookies )?(akzeptieren|erlauben|zulassen)\b'
  consent_reject:
    - '\b(alle )?ablehnen\b'
    - '\bnur (technisch )?(notwendige|erforderliche|essenzielle|essentielle)\b'
    - '\bweiter ohne (einwilligung|zustimmung)\b'
    - '\bverweigern\b'
  # A link or button that opens the consent settings again, Art. 7 Abs. 3 DSGVO.
  consent_settings:
    - '\b(cookie|datenschutz|privatsphaere|einwilligungs|zustimmungs|consent)[- ]?(einstellungen|praeferenzen|optionen|verwaltung|manager)\b'
    - '\b(cookies|einwilligung(en)?|zustimmung(en)?|cookie[- ]?auswahl) (\w+ ){0,2}(aendern|anpassen|verwalten|widerrufen|bearbeiten)\b'
    - '\bwiderruf (der |ihrer |deiner )?(einwilligung|zustimmung)\b'

# Wording inside page text.
text:
  # Confirmation button on the cancellation page, § 312k Abs. 2 Satz 2 BGB.
  cancel_confirm:
    - '\bjetzt kuendigen\b'
  # Confirmation button of the withdrawal function, § 356a Abs. 3 BGB.
  withdraw_confirm:
    - '\bwiderruf bestaetigen\b'
  # Shops, read with sales: true.
  # Final order button, § 312j Abs. 3 BGB. Matched against the whole button text.
  order_button:
    - '^(jetzt )?(zahlungs|kosten)pflichtig (bestellen|kaufen|buchen|mieten|abonnieren)$'
    - '^(jetzt )?(zahlungs|kosten)pflichtige[nr]? (vertrag|auftrag|bestellung) (abschliessen|schliessen|absenden|erteilen)$'
    - '^(jetzt )?kaufen$'
  # Order buttons that do not say that the order costs money.
  order_wrong:
    - '^(jetzt )?(verbindlich |kostenlos |unverbindlich )?bestellen$'
    - '^(kauf|bestellung|auftrag) (jetzt )?(absenden|abschicken|abschliessen|aufgeben|bestaetigen|senden|erteilen)$'
  # Generic labels that may be the last step of a checkout.
  order_generic:
    - '^(weiter|absenden|abschicken|abschliessen|bestaetigen|fertig|senden)$'
  # A checkout page names a payment method and a total.
  checkout_payment:
    - '\b(zahlungsart|zahlungsmethode|zahlungsweise|bezahlart|bezahlmethode)(en)?\b'
  checkout_total:
    - '\b(gesamtsumme|gesamtbetrag|gesamtpreis|endbetrag|endsumme|zwischensumme)\b'
  # Links and buttons of a shop. Shop systems often use English paths.
  shop:
    - '\bwarenkorb'
    - '\beinkaufswagen\b'
    - '\bzur kasse\b'
    - '\b(jetzt )?(kaufen|bestellen)\b'
    - '\b(cart|basket|checkout)\b'
  # Price notices, § 6 Abs. 1 PAngV. § 19 UStG: small businesses charge no VAT and say so.
  vat_included:
    - '\binkl(\.|usive)? (\S+ ){0,3}(mwst|ust|mehrwertsteuer|umsatzsteuer)'
    - '\b(mwst|ust|mehrwertsteuer|umsatzsteuer)\.? (\S+ ){0,2}(enthalten|inbegriffen|inklusive|inkl)'
    - '\b19 ustg\b'
    - '\bkleinunternehmer'
  shipping_costs:
    - '\b(zzgl|zuzueglich|exkl|exklusive|plus)\.? (\S+ ){0,2}(versand|liefer|porto|fracht)'
    - '\b(versand|liefer)kosten'
    - '\b(kostenlose[rn]?|gratis) (versand|lieferung)\b'
    - '\bversand (&|und) zahlung\b'
  # Base price, § 4 PAngV. Number formats are in data/shop.yml.
  base_price:
    - '\bgrundpreis'
  # Lowest price of the last 30 days next to a price reduction, § 11 PAngV.
  lowest_price:
    - '\b(niedrigste|guenstigste|tiefste)[nr]? (\S+ ){0,3}preis(es)? (\S+ ){0,5}(30|dreissig) tage'
    - '\b30 ?-?tage-?(bestpreis|tiefstpreis|niedrigstpreis)'
    - '\b(letzten|vergangenen) (30|dreissig) tage'
  # Manufacturer's recommended price. Comparing with it is no reduction of the own price.
  rrp:
    - '\buvp\b'
    - '\bunverbindliche (\S+ )?preisempfehlung\b'
  # Withdrawal instructions, Art. 246a § 1 Abs. 2 EGBGB, model form from Anlage 2.
  withdrawal_instruction:
    - '\bwiderrufsbelehrung\b'
    - '\bwiderrufsrecht\b'
  model_form:
    - '\bmuster[- ]?widerrufsformular\b'
    - '\bhiermit widerrufe(\(n\))? ich\b'
  # Where the withdrawal function of § 356a BGB is. Not the model form's "den Vertrag widerrufen wollen".
  withdraw_function_hint:
    - '\bwiderrufsfunktion\b'
    - '\bwiderrufsrecht (\S+ ){0,3}online\b'
    - '\bonline (\S+ ){0,3}widerrufen\b'
    - '[„"“]vertrag widerrufen[“"”]'
  # Second way of contact in an imprint besides email, § 5 Abs. 1 Nr. 2 DDG.
  contact_form:
    - '\bkontaktformular'
  # Art. 13 GDPR (DSGVO): what a privacy policy must contain.
  controller:
    - '\bverantwortlich'
    - '\bverantwortliche stelle\b'
  legal_basis:
    - '\brechtsgrundlage'
    - '\bart\.? ?6\b'
  storage_period:
    - '\bspeicherdauer\b'
    - '\bdauer der speicherung\b'
    - '\bgespeichert,? (bis|solange|fuer)\b'
    - '\bloeschfrist'
    - '\b(wird|werden) (\w+ ){0,4}geloescht\b'
    - '\bnach \d+ (tagen|wochen|monaten|jahren)\b'
  right_access:
    - '\bauskunft'
  right_rectification:
    - '\bberichtig'
  right_erasure:
    - '\bloesch'
  right_restriction:
    - '\beinschraenk'
  right_portability:
    - '\bdatenuebertrag'
    - '\bdaten\w* (\w+ ){0,4}uebertrag'
    - '\buebertrag\w* (\w+ ){0,4}daten'
    - '\bkopie (ihrer|der) daten\b'
  right_objection:
    - '\bwiderspruch'
    - '\bwidersprechen\b'
  right_complaint:
    - '\baufsichtsbehoerde\b'
  withdraw_consent:
    - '\bwiderruf'
  # Art. 13(1)(f) GDPR: transfers outside the EU/EEA.
  third_country:
    - '\bdrittland'
    - '\bdrittstaat'
    - '\busa\b'
    - '\bvereinigten? staaten\b'
    - '\bdata privacy framework\b'
    - '\bangemessenheitsbeschluss'
    - '\bstandardvertragsklauseln\b'
  # Optional cookie categories in a consent banner.
  consent_optional:
    - '\bstatistik'
    - '\banalyse'
    - '\bmarketing\b'
    - '\bwerbung\b'
    - '\bpersonalisierung\b'
    - '\bexterne medien\b'
    - '\bkomfort\b'
  # Confirmation shaming: a refusal worded so that saying no sounds like a loss. Only clear phrases.
  consent_shaming:
    - '\b(nein|ich (moechte|will) kein\w*|ich verzichte)\b.{0,40}\bbessere[nmrs]? (angebote?|inhalte?|werbung|erlebnis|nutzererlebnis|empfehlungen|preise)\b'
    - '\bich (moechte|will) (nicht|kein\w*) (sparen|profitieren|unterstuetzen)\b'
    - '\bich (zahle|bezahle) lieber (den )?vollen? preis\b'
    - '\bich bevorzuge (ein |eine )?schlechtere'
  # Template data left in an imprint or privacy policy (legal/placeholder-legal-texts). Only words no real
  # provider uses: "Mustermann" alone is a real surname, a register number like "HRB 12345" exists at many courts.
  placeholder:
    - '\b(max|erika) mustermann\b'
    - '\bmuster(strasse|str\.|weg|allee|gasse|platz)\b'
    - '\b(musterstadt|musterhausen|musterdorf|musterort)\b'
    - '\bmuster(firma|unternehmen|gmbh|ag)\b'
    - '\blorem ipsum\b'
    - '\[ ?(firmenname|firma|name|vor- und nachname|vorname|nachname|ihr name|name des unternehmens|ihr unternehmen|strasse|strasse und hausnummer|adresse|anschrift|plz|ort|plz und ort|stadt|telefon|telefonnummer|e-?mail|e-?mail-adresse|ust-?id(nr\.?)?|umsatzsteuer-id|handelsregister|registernummer|registergericht|datum|website|domain|verantwortliche[rn]?) ?\]'
    - '@(example|beispiel|muster|mustermann|musterfirma|ihre-?domain|ihrefirma)\.(com|org|net|de)\b'
    - '(\+49|0049) ?(\(0\) ?)?123 ?456'
    - '\b0123 ?[/-]? ?456 ?78'
    - '\b01234 ?[/-]? ?56789'
    - '\bde ?123 ?456 ?789\b'

