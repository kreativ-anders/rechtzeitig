# Copy to .github/workflows/rechtzeitig.yml in your repository.
# Then: Actions → rechtzeitig → Run workflow.
# Docs: https://kreativ-anders.github.io/rechtzeitig/
name: rechtzeitig

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the start page (empty = repository only)
        type: string
      language:
        description: Language of the site
        type: choice
        default: de
        options: [de, en, all]
      subscriptions:
        description: Visitors can sign up for subscriptions
        type: boolean
        default: false
      sales:
        description: Consumers buy or sign contracts on the site
        type: boolean
        default: false
      fail-on:
        description: Fail the job on
        type: choice
        default: never
        options: [never, fail, warn]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Lets rechtzeitig read lockfiles, licenses and secrets. Remove to scan the website only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: kreativ-anders/rechtzeitig@v1
        with:
          url: ${{ inputs.url }}
          language: ${{ inputs.language }}
          subscriptions: ${{ inputs.subscriptions }}
          sales: ${{ inputs.sales }}
          fail-on: ${{ inputs.fail-on }}
          # Optional: add the secret IPINFO_TOKEN (free at ipinfo.io) to look up server countries.
          ipinfo-token: ${{ secrets.IPINFO_TOKEN }}
          # Optional: send the findings JSON to your own endpoint. Both empty = nothing leaves the run.
          upload-url: ${{ vars.RECHTZEITIG_UPLOAD_URL }}
          upload-token: ${{ secrets.RECHTZEITIG_UPLOAD_TOKEN }}
