# Copy to .github/workflows/rechtzeitig.yml in your repository.
# Then: Actions → rechtzeitig → Run workflow.
# Docs: https://kreativ-anders.github.io/rechtzeitig/
name: rechtzeitig

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the start page (empty = repository only)
        type: string
      language:
        description: Language of the site
        type: choice
        default: de
        options: [de, en, all]
      subscriptions:
        description: Visitors can sign up for subscriptions
        type: boolean
        default: false
      sales:
        description: Consumers buy or sign contracts on the site
        type: boolean
        default: false
      fail-on:
        description: Fail the job on
        type: choice
        default: never
        options: [never, fail, warn]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Lets rechtzeitig read lockfiles, licenses and secrets. Remove to scan the website only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kreativ-anders/rechtzeitig@4b4b01cd3565c6e4a8e207398f9bc7994253c76c # v0.1.0
        with:
          url: ${{ inputs.url }}
          language: ${{ inputs.language }}
          subscriptions: ${{ inputs.subscriptions }}
          sales: ${{ inputs.sales }}
          fail-on: ${{ inputs.fail-on }}
          # Optional: add the secret IPINFO_TOKEN (free at ipinfo.io) to look up server countries.
          ipinfo-token: ${{ secrets.IPINFO_TOKEN }}
          # Optional: false sends no component list to api.osv.dev and skips the vulnerability rule.
          # vulnerabilities: "true"
          # Optional: days to keep the report artifact. On public repositories anyone signed in can download it.
          # retention-days: "7"
