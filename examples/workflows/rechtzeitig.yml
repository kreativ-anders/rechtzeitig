# Copy to .github/workflows/rechtzeitig.yml in your repository.
# Then: Actions → rechtzeitig → Run workflow.
# Docs: https://rechtzeitig.dev/
name: rechtzeitig

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the start page (empty = repository only)
        type: string
      language:
        description: Language of the site
        type: choice
        default: de
        options: [de, en, all]
      subscriptions:
        description: Visitors can sign up for subscriptions
        type: boolean
        default: false
      sales:
        description: Consumers buy or sign contracts on the site
        type: boolean
        default: false
      fail-on:
        description: Fail the job on
        type: choice
        default: never
        options: [never, fail, warn]
      report-visibility:
        description: Report on the run page (auto = full if private, counts if public)
        type: choice
        default: auto
        options: [auto, full, counts, none]
      sarif-upload:
        description: Also send findings to the Security tab (SARIF, write access only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # security-events: write lets sarif-upload add alerts to the Security tab; unused when it is off.
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      # Lets rechtzeitig read lockfiles, licenses and secrets. Remove to scan the website only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a release. Dependabot can move the pin: https://rechtzeitig.dev/workflow.html#updates
      - uses: kreativ-anders/rechtzeitig@3b54fb9f40f19eaf5be7e5f846c0bd6dc811cc6e # v0.3.0
        with:
          url: ${{ inputs.url }}
          language: ${{ inputs.language }}
          subscriptions: ${{ inputs.subscriptions }}
          sales: ${{ inputs.sales }}
          fail-on: ${{ inputs.fail-on }}
          report-visibility: ${{ inputs.report-visibility }}
          sarif-upload: ${{ inputs.sarif-upload }}
          # Opt-in: the third-country check runs only with the secret IPINFO_TOKEN (free at ipinfo.io).
          # Without the secret it is skipped and nothing is sent to IPinfo.
          ipinfo-token: ${{ secrets.IPINFO_TOKEN }}
          # Optional: only these check groups (legal, privacy, security, sustainability, accessibility, repo). Empty = all.
          # modules: ""
          # Optional: language of the report (de or en). Empty = language of the site.
          # report-language: ""
          # Optional: pages to visit at most.
          # max-pages: "10"
          # Optional: false sends no component list to api.osv.dev and skips the vulnerability rule.
          # vulnerabilities: "true"
          # Optional: false sends no host name to api.thegreenwebfoundation.org and skips the green hosting rule.
          # green-hosting: "true"
          # Optional: false scans without Chrome's sandbox where the runner has none. Only for sites you trust.
          # require-sandbox: "true"
          # Optional: days to keep the report artifact. On public repositories anyone signed in can download it.
          # retention-days: "7"
