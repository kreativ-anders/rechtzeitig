name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same tests before it tags.
  workflow_call:
  # The release workflow starts the checks on its pull request branch, which a push with
  # GITHUB_TOKEN does not do.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Records every outbound connection and sends the list to StepSecurity (insights link in the run). Audit, not block,
      # until a few runs confirm the list below (apt sources of the runner image vary). To block, set
      # egress-policy: block, disable-telemetry: true and allowed-endpoints: >
      #   github.com:443 api.github.com:443 codeload.github.com:443
      #   objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443
      #   results-receiver.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      #   registry.npmjs.org:443 nodejs.org:443
      #   cdn.playwright.dev:443 playwright.download.prss.microsoft.com:443
      #   azure.archive.ubuntu.com:80 archive.ubuntu.com:80 security.ubuntu.com:80
      #   packages.microsoft.com:443 ppa.launchpadcontent.net:443 esm.ubuntu.com:443
      # The tests reach only 127.0.0.1 (test/helpers.ts aborts requests to other hosts, fetch is stubbed).
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run typecheck
      - run: npm test

  # Each commit keeps rule.yml with its check.ts and lang messages, and names changed data files (src/drift.ts).
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same as in test, without Playwright and apt: github.com, api.github.com, registry.npmjs.org and the cache endpoints.
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node src/drift.ts "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
