name: release

# Actions → release → Run workflow, with bump = patch, minor or major.
#
# 1. Runs the tests (test.yml).
# 2. Takes the latest tag vX.Y.Z and bumps it. On top of the tested commit it commits the
#    version in package.json, tags that commit and pushes only the tag. The commit is not on
#    main: the ruleset on main takes changes only through pull requests, and GITHUB_TOKEN
#    cannot bypass it.
# 3. Publishes a GitHub release. Before v1.0.0 it is a pre-release.
# 4. Pushes a branch release/vX.Y.Z with the version and examples/workflows/rechtzeitig.yml
#    pinned to the release commit, starts test.yml on it (pushes with GITHUB_TOKEN start no
#    workflows, a dispatch does) and opens a pull request to main. If Actions may not open
#    pull requests (Settings → Actions → General), the run summary links to open it by hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Credentials stay in this checkout, because this job pushes. It runs no third-party code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${last#v}"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown bump: $BUMP"; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$next" > /dev/null; then
            echo "::error::Tag v$next exists already."; exit 1
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (last: $last)"

      - name: Commit version, tag and push the tag
        id: tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$NEXT" --no-git-tag-version --allow-same-version --ignore-scripts > /dev/null
          if ! git diff --quiet; then
            git commit -q -am "🔖 Release v$NEXT"
          fi
          git tag "v$NEXT"
          git push origin "refs/tags/v$NEXT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          LAST: ${{ steps.version.outputs.last }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Pin the action to the commit SHA of this release, not to the tag:"
            echo
            echo '```yaml'
            echo "- uses: $GITHUB_REPOSITORY@$SHA # v$NEXT"
            echo '```'
            echo
            echo "Example workflow: \`examples/workflows/rechtzeitig.yml\`. Inputs: https://rechtzeitig.dev/workflow.html"
            echo
            echo "## Changes since $LAST"
            echo
            git log "$LAST..v$NEXT" --no-merges --pretty=format:'- %s (%h)'
            echo
          } > "$notes"
          prerelease=()
          if [ "${NEXT%%.*}" = 0 ]; then prerelease=(--prerelease); fi
          gh release create "v$NEXT" --verify-tag --title "v$NEXT" --notes-file "$notes" "${prerelease[@]}"

      # The tagged commit stays as it is. The branch carries the same version plus the pin.
      - name: Open a pull request with the version and the pinned example workflow
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          branch="release/v$NEXT"
          sed -i -E "s|(uses: $GITHUB_REPOSITORY)@[0-9a-f]{40} # v[0-9.]+|\1@$SHA # v$NEXT|" examples/workflows/rechtzeitig.yml
          git diff --quiet && { echo "::error::No pin to $GITHUB_REPOSITORY found in examples/workflows/rechtzeitig.yml"; exit 1; }
          git commit -q -am "📌 Pin the example workflow to v$NEXT"
          git push origin "HEAD:refs/heads/$branch"
          gh workflow run test.yml --ref "$branch"
          title="🔖 Release v$NEXT: version and pinned example workflow"
          body="Sets package.json to v$NEXT and pins examples/workflows/rechtzeitig.yml to the release commit $SHA. The checks were started by the release run."
          if url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body"); then
            echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::Could not open the pull request. Open it by hand: $link"
            echo "Released v$NEXT. Open the pull request by hand: $link" >> "$GITHUB_STEP_SUMMARY"
          fi
