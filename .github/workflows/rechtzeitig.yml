name: rechtzeitig

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the start page (empty = repository only)
        type: string
      language:
        description: Language of the site
        type: choice
        default: en
        options: [de, en, all]
      subscriptions:
        description: Visitors can sign up for subscriptions
        type: boolean
        default: false
      sales:
        description: Consumers buy or sign contracts on the site
        type: boolean
        default: false
      fail-on:
        description: Fail the job on
        type: choice
        default: never
        options: [never, fail, warn]
      report-visibility:
        description: Report on the run page (auto = full if private, counts if public)
        type: choice
        default: auto
        options: [auto, full, counts, none]
      sarif-upload:
        description: Also send findings to the Security tab (SARIF, write access only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # security-events: write lets sarif-upload add alerts to the Security tab; unused when it is off.
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      # Lets rechtzeitig read lockfiles, licenses and secrets. Remove to scan the website only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          url: ${{ inputs.url }}
          language: ${{ inputs.language }}
          subscriptions: ${{ inputs.subscriptions }}
          sales: ${{ inputs.sales }}
          fail-on: ${{ inputs.fail-on }}
          report-visibility: ${{ inputs.report-visibility }}
          sarif-upload: ${{ inputs.sarif-upload }}
          # Opt-in: the third-country check runs only with the secret IPINFO_TOKEN (free at ipinfo.io).
          # Without the secret it is skipped and nothing is sent to IPinfo.
          ipinfo-token: ${{ secrets.IPINFO_TOKEN }}
