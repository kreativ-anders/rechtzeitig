name: rechtzeitig

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # Same as the example. security-events and actions are unused while sarif-upload is false.
    permissions:
      contents: read
      security-events: write
      actions: read
    timeout-minutes: 20
    steps:
      # Lets rechtzeitig read lockfiles, licenses and secrets. Remove to scan the website only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          url: https://rechtzeitig.dev
          language: en
          # The results are read on the run page for now, not in the Security tab.
          sarif-upload: false
          # Report only: the summary is read after each run.
          fail-on: never
          # Opt-in: the third-country check runs only with the secret IPINFO_TOKEN (free at ipinfo.io).
          # Without the secret it is skipped and nothing is sent to IPinfo.
          ipinfo-token: ${{ secrets.IPINFO_TOKEN }}
