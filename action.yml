name: rechtzeitig
description: Check a website and its repository for German legal basics (GDPR, DDG, TDDDG), security and an SBOM.
author: kreativ-anders
branding:
  icon: check-square
  color: green

inputs:
  url:
    description: URL of the start page. Leave empty to scan only the repository.
    default: ""
  language:
    description: Language of the site (de, en, a list such as de,en, or all).
    default: de
  subscriptions:
    description: true if visitors can sign up for subscriptions (checks the cancellation button, § 312k BGB).
    default: "false"
  sales:
    description: true if consumers buy or sign contracts on the site (turns on the shop checks for withdrawal, order button, prices and T&Cs).
    default: "false"
  modules:
    description: Comma list of check groups (legal, privacy, security, sustainability, accessibility, quality) or scopes (website, repository, both; repo is the same as repository) to run. A check runs when its group or its scope is listed; a check of both runs for website or repository, and both picks only those. Empty = all.
    default: ""
  report-language:
    description: Language of the report (de or en). Empty = same as language.
    default: ""
  fail-on:
    description: When the job fails. never = report only, fail = on any fail, warn = on any warn or fail.
    default: never
  max-pages:
    description: How many pages to visit at most.
    default: "10"
  repository:
    description: Folder to scan for lockfiles, licenses and secrets. Empty folder (no checkout) = skip.
    default: ${{ github.workspace }}
  ipinfo-token:
    description: Optional IPinfo token (secret IPINFO_TOKEN). Opt-in IP country lookup for the third-country check (LEG-EU-DSE-005), for servers not in data/hosting.yml or data/third-parties.yml. Empty = the check uses that data only and nothing is sent to IPinfo.
    default: ""
  vulnerabilities:
    description: Opt-in. true sends the name and version of every locked component to api.osv.dev to look up known vulnerabilities. false = send nothing, skip the rule.
    default: "false"
  green-hosting:
    description: Opt-in. true asks api.thegreenwebfoundation.org whether the site's host runs on green energy and sends the host name only. false = send nothing, skip the rule.
    default: "false"
  require-sandbox:
    description: true = stop when Chrome cannot start with its sandbox. false = then scan without it, only for sites you trust.
    default: "true"
  report-visibility:
    description: How much of the report the run shows. auto = everything for private and internal repositories; for public ones only how many checks pass, warn or fail, no artifact (the details go to the Security tab with sarif-upload). full = findings with places in summary, log, annotations and artifact, also on public repositories, where anyone can read them.
    default: auto
  sarif-upload:
    description: Upload the findings as SARIF to GitHub code scanning, so they show as alerts in the Security tab, which only people with write access see. auto = upload where GitHub allows it (job permission security-events write; private repositories also need actions read and GitHub Code Security), otherwise skip with a notice. true = the same, but a skip or failure is a warning. false = never. The upload never fails the job.
    default: auto

outputs:
  result:
    description: pass, warn or fail.
    value: ${{ steps.scan.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install rechtzeitig
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        URL: ${{ inputs.url }}
      run: |
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        if [ -z "$URL" ]; then exit 0; fi
        npx playwright install --with-deps --only-shell chromium
        # Ubuntu 23.10 and later block the user namespaces that Chrome's sandbox needs. On GitHub-hosted
        # runners, which are thrown away after the job, allow them for the Chrome binary only, so the
        # sandbox stays on. Self-hosted runners are left as they are.
        if [ "$RUNNER_ENVIRONMENT" = github-hosted ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          CHROME=$(find "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" -type f -name chrome-headless-shell -path '*chromium_headless_shell-*' | head -n 1)
          if [ -n "$CHROME" ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile rechtzeitig-chrome "%s" flags=(unconfined) {\n  userns,\n}\n' "$CHROME" \
              | sudo tee /etc/apparmor.d/rechtzeitig-chrome > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/rechtzeitig-chrome || echo "::warning::rechtzeitig: could not allow Chrome's sandbox on this runner."
          fi
        fi

    # Gets the job's token, which the scan step never sees. Empty counts as auto.
    - name: Check code scanning
      id: sarif
      if: inputs.sarif-upload != 'false'
      shell: bash
      env:
        MODE: ${{ inputs.sarif-upload }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/src/sarif-preflight.ts"

    - name: Scan
      id: scan
      shell: bash
      env:
        URL: ${{ inputs.url }}
        LANGUAGE: ${{ inputs.language }}
        SUBSCRIPTIONS: ${{ inputs.subscriptions }}
        SALES: ${{ inputs.sales }}
        MODULES: ${{ inputs.modules }}
        REPORT_LANGUAGE: ${{ inputs.report-language }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_PAGES: ${{ inputs.max-pages }}
        REPOSITORY: ${{ inputs.repository }}
        IPINFO_TOKEN: ${{ inputs.ipinfo-token }}
        VULNERABILITIES: ${{ inputs.vulnerabilities }}
        GREEN_HOSTING: ${{ inputs.green-hosting }}
        REQUIRE_SANDBOX: ${{ inputs.require-sandbox }}
        REPORT_VISIBILITY: ${{ inputs.report-visibility }}
        SARIF: ${{ steps.sarif.outputs.upload == 'true' && format('{0}/sarif/rechtzeitig.sarif', runner.temp) || '' }}
      run: >
        node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/src/main.ts"
        --url "$URL" --repo "$REPOSITORY" --language "$LANGUAGE" --subscriptions "$SUBSCRIPTIONS"
        --sales "$SALES" --modules "$MODULES" --report-language "$REPORT_LANGUAGE"
        --fail-on "$FAIL_ON" --max-pages "$MAX_PAGES" --vulnerabilities "$VULNERABILITIES"
        --green-hosting "$GREEN_HOSTING" --require-sandbox "$REQUIRE_SANDBOX" --report-visibility "$REPORT_VISIBILITY" --sarif "$SARIF" --out "$RUNNER_TEMP/rechtzeitig-report"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rechtzeitig-report
        path: ${{ runner.temp }}/rechtzeitig-*
        if-no-files-found: ignore
        retention-days: 7

    # Outside the artifact folder, so a counts-only report on a public repository keeps the artifact empty.
    - name: Upload SARIF
      id: upload
      if: always() && steps.sarif.outputs.upload == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        sarif_file: ${{ runner.temp }}/sarif/rechtzeitig.sarif
        category: rechtzeitig

    - name: SARIF upload result
      if: always() && steps.upload.outcome == 'failure'
      shell: bash
      env:
        MODE: ${{ inputs.sarif-upload }}
      run: |
        level=notice
        if [ "$MODE" = true ]; then level=warning; fi
        echo "::$level::rechtzeitig: could not upload SARIF to code scanning. The findings are in the report. See https://rechtzeitig.dev/workflow.html#security-tab"
