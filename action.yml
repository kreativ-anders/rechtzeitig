name: rechtzeitig
description: Check a website and its repository for German legal basics (GDPR, DDG, TDDDG), security and an SBOM.
author: kreativ-anders
branding:
  icon: check-square
  color: green

inputs:
  url:
    description: URL of the start page. Leave empty to scan only the repository.
    default: ""
  language:
    description: Language of the site (de, en, a list such as de,en, or all).
    default: de
  subscriptions:
    description: true if visitors can sign up for subscriptions (checks the cancellation button, § 312k BGB).
    default: "false"
  sales:
    description: true if consumers buy or sign contracts on the site (turns on the shop checks for withdrawal, order button, prices and T&Cs).
    default: "false"
  modules:
    description: Comma list of check groups to run (legal, privacy, security, sustainability, accessibility, repo). Empty = all.
    default: ""
  report-language:
    description: Language of the report (de or en). Empty = same as language.
    default: ""
  fail-on:
    description: When the job fails. never = report only, fail = on any fail, warn = on any warn or fail.
    default: never
  max-pages:
    description: How many pages to visit at most.
    default: "10"
  repository:
    description: Folder to scan for lockfiles, licenses and secrets. Empty folder (no checkout) = skip.
    default: ${{ github.workspace }}
  ipinfo-token:
    description: Optional IPinfo token (secret IPINFO_TOKEN). Opt-in for the third-country check (LEG-EU-DSE-005). Empty = the check is skipped and nothing is sent to IPinfo.
    default: ""
  vulnerabilities:
    description: true to look up known vulnerabilities of locked components at api.osv.dev. false = send nothing, skip the rule.
    default: "true"
  green-hosting:
    description: true to ask api.thegreenwebfoundation.org whether the site's host runs on green energy. Sends the host name only. false = send nothing, skip the rule.
    default: "true"
  require-sandbox:
    description: true = stop when Chrome cannot start with its sandbox. false = then scan without it, only for sites you trust.
    default: "true"
  report-visibility:
    description: How much of the report the run shows. auto = full for private repositories, counts for public ones. full = findings with places in summary, log, annotations and artifact. counts = only how many checks pass, warn or fail, no artifact. none = only the output result.
    default: auto
  sarif-upload:
    description: Opt-in. true = also upload the findings as SARIF to GitHub code scanning, so they show as alerts in the Security tab, which only people with write access see. Needs the job permission security-events write; private repositories also need GitHub Code Security. A failed upload does not fail the job.
    default: "false"
  retention-days:
    description: Days to keep the report artifact. Artifacts of public repositories can be downloaded by anyone signed in to GitHub.
    default: "7"

outputs:
  result:
    description: pass, warn or fail.
    value: ${{ steps.scan.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install rechtzeitig
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        URL: ${{ inputs.url }}
      run: |
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        if [ -z "$URL" ]; then exit 0; fi
        npx playwright install --with-deps --only-shell chromium
        # Ubuntu 23.10 and later block the user namespaces that Chrome's sandbox needs. On GitHub-hosted
        # runners, which are thrown away after the job, allow them for the Chrome binary only, so the
        # sandbox stays on. Self-hosted runners are left as they are.
        if [ "$RUNNER_ENVIRONMENT" = github-hosted ] && [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          CHROME=$(find "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" -type f -name chrome-headless-shell -path '*chromium_headless_shell-*' | head -n 1)
          if [ -n "$CHROME" ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile rechtzeitig-chrome "%s" flags=(unconfined) {\n  userns,\n}\n' "$CHROME" \
              | sudo tee /etc/apparmor.d/rechtzeitig-chrome > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/rechtzeitig-chrome || echo "::warning::rechtzeitig: could not allow Chrome's sandbox on this runner."
          fi
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        URL: ${{ inputs.url }}
        LANGUAGE: ${{ inputs.language }}
        SUBSCRIPTIONS: ${{ inputs.subscriptions }}
        SALES: ${{ inputs.sales }}
        MODULES: ${{ inputs.modules }}
        REPORT_LANGUAGE: ${{ inputs.report-language }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_PAGES: ${{ inputs.max-pages }}
        REPOSITORY: ${{ inputs.repository }}
        IPINFO_TOKEN: ${{ inputs.ipinfo-token }}
        VULNERABILITIES: ${{ inputs.vulnerabilities }}
        GREEN_HOSTING: ${{ inputs.green-hosting }}
        REQUIRE_SANDBOX: ${{ inputs.require-sandbox }}
        REPORT_VISIBILITY: ${{ inputs.report-visibility }}
        SARIF: ${{ inputs.sarif-upload == 'true' && format('{0}/sarif/rechtzeitig.sarif', runner.temp) || '' }}
      run: >
        node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/src/main.ts"
        --url "$URL" --repo "$REPOSITORY" --language "$LANGUAGE" --subscriptions "$SUBSCRIPTIONS"
        --sales "$SALES" --modules "$MODULES" --report-language "$REPORT_LANGUAGE"
        --fail-on "$FAIL_ON" --max-pages "$MAX_PAGES" --vulnerabilities "$VULNERABILITIES"
        --green-hosting "$GREEN_HOSTING" --require-sandbox "$REQUIRE_SANDBOX" --report-visibility "$REPORT_VISIBILITY" --sarif "$SARIF" --out "$RUNNER_TEMP/rechtzeitig-report"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rechtzeitig-report
        path: ${{ runner.temp }}/rechtzeitig-*
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}

    # Outside the artifact folder, so report-visibility counts or none keeps the artifact empty.
    - name: Upload SARIF
      if: always() && inputs.sarif-upload == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
      with:
        sarif_file: ${{ runner.temp }}/sarif/rechtzeitig.sarif
        category: rechtzeitig
