name: vibecoda
description: Check a website and its repository for German legal basics (GDPR, DDG, TDDDG), security and an SBOM.
author: kreativ-anders
branding:
  icon: check-square
  color: green

inputs:
  url:
    description: URL of the start page. Leave empty to scan only the repository.
    default: ""
  language:
    description: Language of the site (de, en or all).
    default: de
  subscriptions:
    description: true if visitors can sign up for subscriptions (checks the cancellation button, § 312k BGB).
    default: "false"
  sales:
    description: true if consumers buy or sign contracts on the site (checks the withdrawal button, § 356a BGB).
    default: "false"
  modules:
    description: Comma list of check groups to run (legal, privacy, security, sustainability, accessibility, repo). Empty = all.
    default: ""
  report-language:
    description: Language of the report (de or en). Empty = same as language.
    default: ""
  fail-on:
    description: When the job fails. never = report only, fail = on any fail, warn = on any warn or fail.
    default: never
  max-pages:
    description: How many pages to visit at most.
    default: "10"
  repository:
    description: Folder to scan for lockfiles, licenses and secrets. Empty folder (no checkout) = skip.
    default: ${{ github.workspace }}
  ipinfo-token:
    description: Optional IPinfo token. Looks up the country of third-party servers that vibecoda does not know.
    default: ""

outputs:
  result:
    description: pass, warn or fail.
    value: ${{ steps.scan.outputs.result }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: Install vibecoda
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        URL: ${{ inputs.url }}
      run: |
        npm ci --omit=dev --no-audit --no-fund
        if [ -n "$URL" ]; then npx playwright install --with-deps --only-shell chromium; fi

    - name: Scan
      id: scan
      shell: bash
      env:
        URL: ${{ inputs.url }}
        LANGUAGE: ${{ inputs.language }}
        SUBSCRIPTIONS: ${{ inputs.subscriptions }}
        SALES: ${{ inputs.sales }}
        MODULES: ${{ inputs.modules }}
        REPORT_LANGUAGE: ${{ inputs.report-language }}
        FAIL_ON: ${{ inputs.fail-on }}
        MAX_PAGES: ${{ inputs.max-pages }}
        REPOSITORY: ${{ inputs.repository }}
        IPINFO_TOKEN: ${{ inputs.ipinfo-token }}
      run: >
        node --disable-warning=ExperimentalWarning "$GITHUB_ACTION_PATH/src/main.ts"
        --url "$URL" --repo "$REPOSITORY" --language "$LANGUAGE" --subscriptions "$SUBSCRIPTIONS"
        --sales "$SALES" --modules "$MODULES" --report-language "$REPORT_LANGUAGE"
        --fail-on "$FAIL_ON" --max-pages "$MAX_PAGES" --out "$RUNNER_TEMP/vibecoda-report"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vibecoda-report
        path: ${{ runner.temp }}/vibecoda-*
        if-no-files-found: ignore
