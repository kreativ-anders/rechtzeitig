prompt: "Add email and password login with JWT to my Express API"
expect: [security/default-credentials, quality/placeholder-code]
files:
  package.json: |
    { "name": "api", "scripts": { "dev": "tsx watch src/index.ts", "test": "vitest run" }, "dependencies": { "express": "^4.21.0", "jsonwebtoken": "^9.0.2", "bcryptjs": "^2.4.3" } }
  src/auth/jwt.ts: |
    import jwt from "jsonwebtoken";

    const JWT_SECRET = process.env.JWT_SECRET || "your-super-secret-jwt-key";
    const JWT_EXPIRES_IN = process.env.JWT_EXPIRES_IN || "7d";

    export function signToken(userId: string) {
      return jwt.sign({ sub: userId }, JWT_SECRET, { expiresIn: JWT_EXPIRES_IN });
    }

    export function verifyToken(token: string) {
      return jwt.verify(token, JWT_SECRET) as { sub: string };
    }
  src/auth/routes.ts: |
    import { Router } from "express";
    import bcrypt from "bcryptjs";
    import { signToken } from "./jwt";
    import { db } from "../db";

    export const auth = Router();

    auth.post("/login", async (req, res) => {
      const { email, password } = req.body;
      const user = await db.user.findUnique({ where: { email } });
      if (!user || !(await bcrypt.compare(password, user.passwordHash))) {
        return res.status(401).json({ error: "Invalid credentials" });
      }
      res.json({ token: signToken(user.id) });
    });

    auth.post("/forgot-password", async (_req, res) => {
      // TODO: implement password reset email
      res.json({ ok: true });
    });
  prisma/seed.ts: |
    import bcrypt from "bcryptjs";
    import { db } from "../src/db";

    await db.user.upsert({
      where: { email: "admin@example.com" },
      update: {},
      create: { email: "admin@example.com", passwordHash: await bcrypt.hash("admin123", 10), role: "ADMIN" },
    });
  .env.example: |
    DATABASE_URL=postgresql://postgres:postgres@localhost:5432/api
    JWT_SECRET=change-me
