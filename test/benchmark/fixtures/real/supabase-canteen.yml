    # Razorpay Configuration
    # Get these from https://dashboard.razorpay.com/app/keys
    VITE_RAZORPAY_KEY_ID=rzp_test_your_key_id_here
    VITE_RAZORPAY_KEY_SECRET=your_razorpay_secret_key_here

    # Supabase Configuration
    # Get these from your Supabase project settings
    VITE_SUPABASE_URL=https://your-project-url.supabase.co
    VITE_SUPABASE_ANON_KEY=your_supabase_anon_key_here

    # Clerk Authentication
    # Get these from https://dashboard.clerk.com/
    VITE_CLERK_PUBLISHABLE_KEY=pk_test_your_clerk_publishable_key_here

    # IMPORTANT NOTES:
    # 1. Copy this file to .env for local development
    # 2. Never commit .env to git (it's in .gitignore)
    # 3. For Netlify deployment, add these variables in:
    #    Site Settings → Environment Variables
    # 4. For production, use live keys instead of test keys:
    #    - Razorpay: rzp_live_... instead of rzp_test_...
    #    - Clerk: pk_live_... instead of pk_test_...
