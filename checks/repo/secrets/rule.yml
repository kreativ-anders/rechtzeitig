# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-SECRETS-001
severity: critical
title:
  de: "Keine Geheimnisse im Repository"
  en: "No secrets in the repository"
legal_basis:
  de: "Art. 32 DSGVO"
  en: "Art. 32 GDPR"
how: "Matches tracked files line by line against `data/secrets.yml`, decoding JWT payloads where a pattern names claims (Supabase `service_role` keys); shows only the first 4 characters and the length of each find."
fix_hint:
  de: "Gefundene Schlüssel sofort widerrufen, dann aus Code und Git-Historie entfernen und als Secret oder Umgebungsvariable hinterlegen."
  en: "Revoke found keys right away, then remove them from code and git history and store them as secrets or environment variables."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
