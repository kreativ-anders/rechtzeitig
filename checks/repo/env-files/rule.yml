id: SEC-SECRETS-002
severity: high
title:
  de: ".env-Dateien bleiben außerhalb von Git"
  en: ".env files stay out of git"
legal_basis:
  de: "Art. 32 DSGVO"
  en: "Art. 32 GDPR"
how: "Lists committed `.env*` files (except templates and fixtures) and checks that `.gitignore` ignores `.env`."
