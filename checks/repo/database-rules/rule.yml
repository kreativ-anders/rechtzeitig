# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DBAI-001
severity: critical
tier: free
title:
  de: "Datenbankregeln öffnen keine Daten für alle"
  en: "Database rules do not open data to everyone"
legal_basis:
  de: "Art. 32 DSGVO"
  en: "Art. 32 GDPR"
how: "Splits `supabase/**/*.sql` into statements and compares `create table` in the public schema with `enable row level security`; looks for `if true` and test mode (`request.time < timestamp.date(...)`) in Firebase rules."
fix_hint:
  de: "Row Level Security für jede Tabelle aktivieren und Regeln mit \"if true\" oder Testmodus-Datum durch Prüfungen auf den angemeldeten Nutzer ersetzen."
  en: "Enable row level security on every table and replace \"if true\" and test-mode rules with checks on the signed-in user."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://supabase.com/docs/guides/database/postgres/row-level-security
  - https://firebase.google.com/docs/rules/insecure-rules
