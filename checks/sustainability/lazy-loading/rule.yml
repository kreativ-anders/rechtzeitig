# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SUS-LAZY-001
severity: low
title:
  de: "Bilder unterhalb des ersten Bildschirms laden erst bei Bedarf"
  en: "Images below the fold load lazily"
how: "Lists images on all visited own pages, loaded with JavaScript, whose top edge lies below the first 1280x720 viewport and that have no `loading=\"lazy\"`, ignoring images under 50x50 pixels and the data: placeholders that script-based lazy loading shows until scrolling."
fix_hint:
  de: "Bildern unterhalb des ersten Bildschirms loading=\"lazy\" geben, mit width und height, damit nichts springt. Bilder im ersten Bildschirm ohne lazy laden."
  en: "Give images below the first screen loading=\"lazy\", with width and height so nothing jumps. Load images in the first screen without lazy."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://www.w3.org/TR/web-sustainability-guidelines/#lazy-loading
  - https://www.w3.org/TR/web-sustainability-guidelines/#defer-the-loading-of-non-critical-resources
