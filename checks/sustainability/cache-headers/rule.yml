# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SUS-CACHE-001
severity: low
title:
  de: "Eigene statische Dateien dürfen im Browser-Cache bleiben"
  en: "Own static files may stay in the browser cache"
how: "Loads pages with the browser cache off and lists the site's own scripts, stylesheets, images and fonts (`static` in `data/file-formats.yml`) whose answer has no positive `max-age`, no `immutable` and no future `Expires`."
fix_hint:
  de: "Für Dateien mit Versionsnummer oder Hash im Namen Cache-Control: public, max-age=31536000, immutable senden, für andere statische Dateien eine kürzere max-age."
  en: "Send Cache-Control: public, max-age=31536000, immutable for files with a version or hash in their name, and a shorter max-age for other static files."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://www.w3.org/TR/web-sustainability-guidelines/#client-side-caching
  - https://www.rfc-editor.org/rfc/rfc9111
