# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SUS-JS-001
severity: medium
title:
  de: "Impressum und Datenschutz funktionieren ohne JavaScript"
  en: "Imprint and privacy policy work without JavaScript"
legal_basis:
  de: "§ 5 DDG (leicht erkennbar, unmittelbar erreichbar), Art. 12 Abs. 1 DSGVO (leicht zugängliche Form)"
  en: "§ 5 DDG (easily recognizable, directly accessible), Art. 12(1) GDPR (easily accessible form)"
how: "Checks that imprint and privacy links (`imprint`, `privacy`, link words of every language in `lang/*.yml`) exist on the start page with JavaScript off and that the page they lead to (found on the start page or its hreflang version in the scan language) shows at least 100 characters of text without JavaScript."
fix_hint:
  de: "Links und Texte der Rechtsseiten als statisches HTML ausliefern."
  en: "Deliver the links and texts of the legal pages as static HTML."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://www.gesetze-im-internet.de/ddg/__5.html
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
