id: LEG-DFA-004
severity: medium
title: "Saying no is not worded to shame"
value: "Digital Fairness Act proposal COM(2026) 1100, Annex I point 56: would ban wording that makes refusing an offer sound shameful (confirmshaming)."
how: "On every visited own page, both loads, warns for each visible link or button whose text uses shaming words (`shaming`, also read by `privacy/consent-equal-choice` for consent banners, whose buttons are left out here), for example in newsletter and discount pop-ups; info instead of no finding when a page did not load with JavaScript, since pop-ups come from scripts. Pop-ups that open only on a click or when leaving the page are not seen."
fix_hint: "Label the refusal neutrally, for example \"Nein, danke\" or \"No thanks\"."
