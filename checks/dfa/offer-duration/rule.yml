# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-DFA-005
severity: low
title: "Limited-time offers say when they end"
value: "Digital Fairness Act proposal COM(2026) 1100, Annex I point 14: would ban a limited-time offer that does not say how long it lasts."
how: "On every visited own page but the legal pages, both loads, finds limited-time claims (`limited_time`: \"Nur heute\", \"Angebot endet bald\", \"limited time\") and warns when neither that text block nor the one before or after it (`context_lines` in `data/thresholds.yml`) holds a date or time (`date` in `data/shop.yml`, `date_words`); a date shown only in an image or a timer is not seen as a date unless it is text. Whether a stated end is true needs a second visit (not checked)."
requires: [sales]
fix_hint: "Next to every limited offer, give its end as a date and time (\"gültig bis 30.11.2026, 23:59 Uhr\"), and end it then."
meta:
  last_reviewed: "2026-11-22"
  sources:
  - https://commission.europa.eu/document/download/a0539d90-2758-48e5-9010-1e856030d166_en?filename=Annexes%20to%20the%20Proposal%20for%20a%20Digital%20Fairness%20Act.pdf
