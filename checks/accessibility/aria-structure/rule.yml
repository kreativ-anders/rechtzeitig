# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: A11Y-STRUCT-001
severity: medium
title: "Lists, menus and tables are built correctly"
legal_basis: "BFSG with § 3 BFSGV; EN 301 549 V3.2.1 clause 9.1.3.1 (WCAG 2.1 success criterion 1.3.1)"
how: "Runs the axe-core rules listed for `accessibility/aria-structure` in `data/accessibility.yml` on every visited own page with JavaScript on, inside the browser and without sending anything, and lists lists, menus, tables, grids, tabs, trees and other ARIA roles that lack the children or the parent they need, such as a `role=menu` without menu items or an `<li>` outside a list, with page and CSS selector; it only warns, since the BFSG does not apply to every site; warns instead of no finding when axe-core gave no result on one of these pages, naming the page and the reason (timeout or error)."
fix_hint: "Give elements with a composite role the children they need: role=menu and menubar need menuitem, tablist needs tab, list needs listitem, table and grid need row; and put every menuitem, tab or listitem inside its matching parent. <ul> and <ol> may only contain <li> directly. Where the role is wrong, remove it instead of adding children. Required by the BFSG for e-commerce services to consumers since 28 June 2025, except for microenterprises; useful for every visitor."
meta:
  last_reviewed: "2026-11-14"
  sources:
  - https://www.gesetze-im-internet.de/bfsg/
