# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: A11Y-MOTION-001
severity: medium
title: "Videos that start automatically can be paused"
legal_basis: "BFSG with § 3 BFSGV; EN 301 549 V3.2.1 clause 9.2.2.2 (WCAG 2.1 success criterion 2.2.2) and, with sound, clause 9.1.4.2 (WCAG 2.1 success criterion 1.4.2)"
how: "Lists `<video autoplay>` elements without the controls attribute on all visited own pages, loaded with JavaScript, and names those that are not muted as playing sound; it cannot see the video's length or custom play buttons, so it only warns."
fix_hint: "Do not start videos automatically, or offer the controls attribute or your own pause button. Never play sound automatically. Autoplay also loads data many visitors never watch; preload=\"none\" and a poster image save it."
meta:
  last_reviewed: "2026-11-04"
