# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: A11Y-CONTRAST-001
severity: low
title:
  de: "Text hat genug Kontrast"
  en: "Text has enough contrast"
legal_basis:
  de: "BFSG mit § 3 BFSGV; EN 301 549 V3.2.1 Nr. 9.1.4.3 (WCAG 2.1 Erfolgskriterium 1.4.3)"
  en: "BFSG with § 3 BFSGV; EN 301 549 V3.2.1 clause 9.1.4.3 (WCAG 2.1 success criterion 1.4.3)"
how: "Runs the axe-core rules listed for `accessibility/contrast` in `data/accessibility.yml` on every visited own page with JavaScript on, inside the browser and without sending anything, and lists text whose contrast against its background is below 4.5:1 (3:1 for large text), only where axe-core can compute the background; text over images or gradients is left out, with page and CSS selector; it only warns, since the BFSG does not apply to every site."
fix_hint:
  de: "Text- oder Hintergrundfarbe so ändern, dass der Kontrast mindestens 4,5:1 beträgt, bei großem Text (ab 24 px oder 18,66 px fett) 3:1. Pflicht nach BFSG für Dienstleistungen im elektronischen Geschäftsverkehr mit Verbrauchern seit 28.06.2025, außer für Kleinstunternehmen; für alle Besucher sinnvoll."
  en: "Change the text or background color to reach a contrast of at least 4.5:1, or 3:1 for large text (from 24 px, or 18.66 px bold). Required by the BFSG for e-commerce services to consumers since 28 June 2025, except for microenterprises; useful for every visitor."
meta:
  last_reviewed: "2026-11-08"
  sources:
  - https://www.gesetze-im-internet.de/bfsg/
  - https://www.gesetze-im-internet.de/bfsgv/
  - https://www.etsi.org/deliver/etsi_en/301500_301599/301549/03.02.01_60/en_301549v030201p.pdf
  - https://www.w3.org/WAI/WCAG21/Understanding/contrast-minimum.html
