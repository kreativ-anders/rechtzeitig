# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-CNS-001
severity: high
title:
  de: "Keine fremden Server vor Einwilligung"
  en: "No third-party servers before consent"
legal_basis:
  de: "Art. 6 Abs. 1 DSGVO, § 25 TDDDG, LG München I 3 O 17493/20 (Google Fonts)"
  en: "Art. 6(1) GDPR, § 25 TDDDG, LG München I 3 O 17493/20 (Google Fonts)"
how: "Records every request to another site while loading pages without clicks, groups hosts by vendor from `data/third-parties.yml` (else by domain); `consent: required` vendors fail, others warn, and a page that did not load with JavaScript warns instead of passing."
fix_hint:
  de: "Schriften, Skripte und Bibliotheken selbst hosten; Einbettungen (Videos, Karten) erst nach Klick oder Einwilligung laden."
  en: "Host fonts, scripts and libraries yourself; load embeds (videos, maps) only after a click or consent."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://www.gesetze-im-internet.de/ttdsg/__25.html
  - https://www.gesetze-bayern.de/Content/Document/Y-300-Z-BECKRS-B-2022-N-612
