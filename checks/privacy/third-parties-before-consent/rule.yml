# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-CNS-001
severity: high
title: "No third-party servers before consent"
legal_basis: "Art. 6(1) GDPR, § 25 TDDDG, LG München I 3 O 17493/20 (Google Fonts)"
how: "Records every request to another site (registrable domain by the Public Suffix List in `data/public-suffixes.dat`, so tenants of shared hosts like azurewebsites.net differ) while loading pages without clicks, groups hosts by vendor from `data/third-parties.yml` (else by domain); `consent: required` vendors fail, others warn, and a page that did not load with JavaScript warns instead of no finding."
fix_hint: "Host fonts, scripts and libraries yourself; load embeds (videos, maps) only after a click or consent."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://www.gesetze-im-internet.de/ttdsg/__25.html
  - https://www.gesetze-bayern.de/Content/Document/Y-300-Z-BECKRS-B-2022-N-612
