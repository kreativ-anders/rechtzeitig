# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-CNS-005
severity: medium
title:
  de: "Einwilligung lässt sich später ändern oder widerrufen"
  en: "Consent can be changed or withdrawn later"
legal_basis:
  de: "Art. 7 Abs. 3 DSGVO, § 25 TDDDG"
  en: "Art. 7(3) GDPR, § 25 TDDDG"
how: "When the start page has a consent banner (`consent_accept` in dialogs, cookie containers or shadow roots), looks on the start page outside the banner, then on the privacy policy linked from the start page or its hreflang version in the scan language (using the link words of every language in `lang/*.yml`), for a link or button to the consent settings (`consent_settings`, also by aria-label or title); the scan never clicks, so a widget that appears only after a choice is not seen."
fix_hint:
  de: "Auf jeder Seite einen stets sichtbaren Link oder ein Icon anbieten, das die Cookie-Einstellungen direkt wieder öffnet, zum Beispiel „Cookie-Einstellungen“ im Footer."
  en: "Offer an always visible link or icon on every page that opens the cookie settings directly, for example \"Cookie settings\" in the footer."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://www.gesetze-im-internet.de/ttdsg/__25.html
  - https://www.datenschutzkonferenz-online.de/media/oh/20221205_oh_Telemedien_2021_Version_1_1_Vorlage_104_DSK_final.pdf
