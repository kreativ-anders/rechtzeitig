# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-DSE-005
severity: medium
title:
  de: "Datenschutzerklärung nennt Übermittlungen außerhalb der EU"
  en: "Privacy policy names transfers outside the EU"
legal_basis:
  de: "Art. 13 Abs. 1 lit. f, Art. 44 ff. DSGVO, EuGH C-311/18 (Schrems II)"
  en: "Art. 13(1)(f), Art. 44 ff. GDPR, ECJ C-311/18 (Schrems II)"
how: "Gets the country of each third-party service (`country` in `data/third-parties.yml`, else IPinfo) and, for countries outside the EEA (`data/countries.yml`), looks for `third_country` wording in the privacy policy; info when no country is known."
requires: [ipinfo-token]
fix_hint:
  de: "Für jeden Dienst außerhalb von EU/EWR Land und Garantie nennen (z. B. Data Privacy Framework, Standardvertragsklauseln)."
  en: "Name the country and the safeguard for each service outside the EU/EEA (for example Data Privacy Framework, standard contractual clauses)."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62018CJ0311
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023D1795
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62023TJ0553
