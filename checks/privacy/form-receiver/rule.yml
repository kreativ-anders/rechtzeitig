# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-DSE-008
severity: medium
title: "Privacy policy names where forms send their data"
legal_basis: "Art. 13(1)(e) and (f), Art. 28, Art. 44 GDPR"
how: "Finds form backends in the repository's templates, code and config (`forms` in `data/third-parties.yml`, files in `data/consent-tools.yml`) and forms on the visited pages (from the load without JavaScript where the load with JavaScript failed) whose action host the repository names, then looks for each receiver's `names` as whole words in the privacy policy (linked from the start page or its hreflang version in the scan language); a receiver outside the EEA (`data/countries.yml`) without third-country wording gives info."
fix_hint: "Name the form service as recipient (processor) with purpose, legal basis, storage period and country, for a provider outside the EU with the basis of the transfer. Or send the form to your own server."
meta:
  last_reviewed: "2026-11-09"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
