# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-DSE-004
severity: medium
title: "Privacy policy names the services the site uses"
legal_basis: "Art. 13(1)(e) GDPR"
how: "For every contacted third-party service, looks for its name (`names` in `data/third-parties.yml`, else its domain) as a whole word in the privacy policy (linked from the start page or its hreflang version in the scan language); warns instead of no finding when a page did not load with JavaScript."
fix_hint: "List every embedded service with purpose and legal basis in the privacy policy."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
