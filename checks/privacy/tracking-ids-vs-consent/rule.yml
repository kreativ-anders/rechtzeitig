# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-EU-CNS-009
severity: high
title:
  de: "Tracking-IDs aus dem Code laden nicht vor der Einwilligung"
  en: "Tracking ids from the code do not load before consent"
legal_basis:
  de: "§ 25 Abs. 1 TDDDG; Art. 6 Abs. 1 lit. a DSGVO"
  en: "§ 25(1) TDDDG; Art. 6(1)(a) GDPR"
how: "Finds tag and account ids of tracking services in the repository's templates, code, config and tracked .env files (`ids` in `data/third-parties.yml`, files in `data/consent-tools.yml`) and looks for each in the URLs the visited pages requested without a click: sent fails with the line, an id not loaded warns only when neither the site (banner, consent platform) nor the repository (packages, loader scripts in `data/consent-tools.yml`) has a consent tool."
fix_hint:
  de: "Das Tag erst nach der Einwilligung laden, zum Beispiel über das Consent-Tool (Skript-Blocking) oder Google Consent Mode mit Standard \"denied\" und ohne Cookies vorher."
  en: "Load the tag only after consent, for example through the consent tool (script blocking) or Google Consent Mode with default \"denied\" and no cookies before."
meta:
  last_reviewed: "2026-11-09"
  sources:
  - https://www.gesetze-im-internet.de/ttdsg/__25.html
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://www.datenschutzkonferenz-online.de/media/oh/OH_Digitale_Dienste.pdf
