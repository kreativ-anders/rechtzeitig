# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-HDR-002
severity: medium
title: "Cookies use secure flags"
legal_basis: "Art. 32 GDPR"
how: "Checks Secure on every cookie set without login (HTTPS sites, and always with `SameSite=None`) and HttpOnly on cookies whose name looks like a session (`data/cookies.yml`); cookies of other sites only give info; gives info instead of no finding when a page did not load with JavaScript."
fix_hint: "Set cookies with Secure; session cookies also with HttpOnly and SameSite=Lax."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
