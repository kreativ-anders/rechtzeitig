# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-SUPPLY-002
severity: low
title: "Manifest and lockfile agree"
legal_basis: "CRA Art. 13(5) with Annex I Part II(1), an accurate SBOM (from 11 Dec 2027)"
how: "Warns on lockfiles of two package managers in one folder and a `packageManager` field that names another manager than the lockfile there (managers in `data/packages.yml`), and on dependencies of package.json and Cargo.toml whose locked versions no longer match the manifest: the specifier pnpm recorded, the descriptor in yarn.lock, or for package-lock.json and Cargo.lock a range none of the locked versions meets (`src/repo/semver.ts`); dependencies missing from the lockfile are left to `security/hallucinated-packages`; gives info instead of no finding when a lockfile next to a manifest could not be read, and skips when no manifest has a lockfile."
fix_hint: "Pick one package manager and delete the other lockfiles; after each manifest change let the package manager rewrite the lockfile, and install in CI with npm ci, pnpm install --frozen-lockfile, yarn install --immutable or cargo build --locked."
meta:
  last_reviewed: "2026-11-09"
