# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DEPS-005
severity: low
title: "GitHub Actions are pinned to a commit"
legal_basis: "CRA Art. 13(5), due diligence for third-party components (from 11 Dec 2027)"
how: "Reads `uses:` lines in `.github/workflows/*.yml` and lists actions not pinned to a 40-character commit SHA; gives info instead of no finding when one of its files is over the `repo` limit in `data/thresholds.yml` or only a Git LFS pointer."
fix_hint: "Use owner/action@<commit-sha> instead of a tag; Dependabot keeps the SHAs current."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
