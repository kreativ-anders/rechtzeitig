# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DEPS-005
severity: low
title:
  de: "GitHub Actions sind auf einen Commit gepinnt"
  en: "GitHub Actions are pinned to a commit"
legal_basis:
  de: "CRA Art. 13 Abs. 5, Sorgfalt bei Komponenten Dritter (ab 11.12.2027)"
  en: "CRA Art. 13(5), due diligence for third-party components (from 11 Dec 2027)"
how: "Reads `uses:` lines in `.github/workflows/*.yml` and lists actions neither pinned to a 40-character commit SHA nor recorded for that workflow in `.github/workflows/actions.lock`, reusable workflows without a SHA (the lockfile does not cover them) and `docker://` images without a `sha256` digest; gives info when the lockfile cannot be parsed, or instead of no finding when one of its files is over the `repo` limit in `data/thresholds.yml` or only a Git LFS pointer."
fix_hint:
  de: "Auf github.com mit gh actions-lock eine Workflow-Lockfile (.github/workflows/actions.lock) anlegen; sonst, etwa auf GitHub Enterprise Server, uses: owner/action@<commit-sha> statt eines Tags verwenden. Wiederverwendbare Workflows immer per SHA, docker://-Images per @sha256-Digest pinnen. Dependabot hält SHAs und Lockfile-Einträge aktuell."
  en: "On github.com, create a workflow lockfile (.github/workflows/actions.lock) with gh actions-lock; elsewhere, such as GitHub Enterprise Server, use owner/action@<commit-sha> instead of a tag. Always pin reusable workflows by SHA and docker:// images by @sha256 digest. Dependabot keeps SHAs and lockfile entries current."
meta:
  last_reviewed: "2026-11-21"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - https://docs.github.com/en/actions/concepts/security/workflow-dependency-lockfiles
  - https://docs.github.com/en/actions/reference/security/secure-use
