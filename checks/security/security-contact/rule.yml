# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-CVD-001
severity: low
title: "The project names a contact for vulnerabilities"
legal_basis: "CRA Annex I Part II(5) and (6), contact address and vulnerability disclosure (from 11 Dec 2027)"
how: "Looks for `SECURITY.md` in the root, `.github/` or `docs/` and for `.well-known/security.txt` anywhere outside test fixtures, whose `Contact` and `Expires` fields it reads; skips repositories without a package manifest in any folder outside fixtures."
fix_hint: "Add SECURITY.md with a reporting channel (email or GitHub private vulnerability reporting) and a response time. A SECURITY.md in the organization's .github repository counts too, but is not visible here."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - https://docs.github.com/en/code-security/how-tos/report-and-fix-vulnerabilities/configure-vulnerability-reporting/add-security-policy
  - https://www.rfc-editor.org/rfc/rfc9116.html
