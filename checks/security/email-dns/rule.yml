# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DNS-001
severity: medium
title: "Domain is protected against email spoofing"
legal_basis: "Art. 32 GDPR"
how: "Reads the SPF TXT record of the registrable domain and the DMARC record at `_dmarc.`; flags missing ones, SPF that allows every server (`+all`, `?all`) and DMARC `p=none`."
fix_hint: "Publish SPF and DMARC records; a domain without mail needs only \"v=spf1 -all\" and \"v=DMARC1; p=reject\"."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
