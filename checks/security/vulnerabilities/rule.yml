# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DEPS-001
severity: high
title: "No dependencies with known vulnerabilities"
legal_basis: "Art. 32 GDPR, CRA Annex I Part I(2)(a) and Part II(2) (from 11 Dec 2027)"
how: "Sends the package URLs of all locked components to the OSV API (each request retried once after a network error, timeout, 429 or 5xx; ends as an error when OSV still cannot be asked) and loads details for up to 100 issues, showing the fixed version of the OSV range that contains the installed version (none when no range does); one finding per lockfile that locks the affected version; high and critical issues fail when any lockfile uses the package in production; gives info instead of no finding when a lockfile could not be read or a package file has no parser (`data/ecosystems.yml`)."
requires: [vulnerabilities]
fix_hint: "Update the affected packages to at least the fixed version shown."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - https://osv.dev
