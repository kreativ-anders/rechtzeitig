# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-SECRETS-001
severity: critical
title: "No secrets in the repository"
legal_basis: "Art. 32 GDPR"
how: "Matches tracked files, including checked-out submodules, except the key and credential files that `security/key-files` reports from `data/key-files.yml`, line by line against the patterns in `data/secrets.yml` (many adapted from gitleaks), each only on lines with one of its keywords, decoding JWT payloads where a pattern names claims (Supabase `service_role` keys) and dropping finds below the entropy in `data/thresholds.yml`, with a placeholder word, or matching a documented example; a random-looking value under a name like secret, password or token is only a warning; nothing leaves the runner, and the report shows only the first 4 characters and the length of each find, and counts the files it could not read (binary, over the `repo` limit in `data/thresholds.yml`, Git LFS pointers); gives info instead of no finding when not a single file could be read or a file is over the `repo` limit or only a Git LFS pointer (binary files stay excluded)."
fix_hint: "Revoke found keys right away, then remove them from code and git history and store them as secrets or environment variables."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
