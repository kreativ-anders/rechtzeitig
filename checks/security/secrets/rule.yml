# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-SECRETS-001
severity: critical
title:
  de: "Keine Geheimnisse im Repository"
  en: "No secrets in the repository"
legal_basis:
  de: "Art. 32 DSGVO"
  en: "Art. 32 GDPR"
how: "Matches tracked files, including checked-out submodules, line by line against the patterns in `data/secrets.yml` (many adapted from gitleaks), each only on lines with one of its keywords, decoding JWT payloads where a pattern names claims (Supabase `service_role` keys) and dropping finds below the entropy in `data/thresholds.yml`, with a placeholder word, or matching a documented example; a random-looking value under a name like secret, password or token is only a warning; nothing leaves the runner, and the report shows only the first 4 characters and the length of each find, and counts the files it could not read (binary, over the `repo` limit in `data/thresholds.yml`, Git LFS pointers)."
fix_hint:
  de: "Gefundene Schlüssel sofort widerrufen, dann aus Code und Git-Historie entfernen und als Secret oder Umgebungsvariable hinterlegen."
  en: "Revoke found keys right away, then remove them from code and git history and store them as secrets or environment variables."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
