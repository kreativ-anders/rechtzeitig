# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-HDR-005
severity: medium
title: "CORS does not share answers with credentials to any site"
legal_basis: "Art. 32 GDPR"
how: "Reads the response headers of the site's own pages, also those whose load with JavaScript failed, and fails when Access-Control-Allow-Credentials: true comes with Access-Control-Allow-Origin * or null; it sends no foreign Origin, so a server that mirrors any Origin is not detected."
fix_hint: "Send Access-Control-Allow-Credentials only with a fixed list of trusted origins, never with * or null, and do not copy the Origin from the request unchecked. If the pages need no CORS, leave out both headers."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://fetch.spec.whatwg.org/#cors-protocol-and-credentials
  - https://fetch.spec.whatwg.org/#cors-check
