# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-HDR-003
severity: medium
title: "Scripts and stylesheets from other sites carry an integrity hash"
legal_basis: "Art. 32 GDPR"
how: "Lists <script src> and <link rel=stylesheet> elements in the HTML of the site's own pages (load without JavaScript, also where the load with JavaScript failed) that point to another site and have no integrity attribute; for services whose files change under the same URL (`data/subresource-integrity.yml`) it adds how to fix them without a hash."
fix_hint: "Load fixed versions of other sites' files with integrity=\"sha384-…\" and crossorigin=\"anonymous\" (most CDNs show the hash), or host the file yourself. For services that change their file under the same URL, host a pinned copy or accept the risk knowingly."
meta:
  last_reviewed: "2026-11-11"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://www.w3.org/TR/sri/#resource-integrity
  - https://www.w3.org/TR/sri/#the-integrity-attribute
