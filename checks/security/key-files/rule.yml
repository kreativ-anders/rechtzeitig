# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-SECRETS-004
severity: high
title:
  de: "Schlüssel- und Datenbankdateien bleiben außerhalb von Git"
  en: "Key and database files stay out of git"
legal_basis:
  de: "Art. 5 Abs. 1 lit. f, Art. 32 DSGVO"
  en: "Art. 5(1)(f), Art. 32 GDPR"
how: "Matches the paths of tracked files against `data/key-files.yml` and decides by content where the file is text: a `.pem`, `.key` or `id_rsa` file with a private key block, a PuTTY `.ppk` with private lines, a service account JSON with `private_key`, an `.npmrc`, `.yarnrc.yml` or `.pypirc` with a literal token or password (not `${NPM_TOKEN}`), and a Terraform state with resources fail; a binary `.p12`/`.pfx`, `.sqlite`/`.db` or pg_dump file and an SQL dump with rows (migration version rows alone excluded) warn; public keys, certificates without a key, test, example and template paths, fixtures and vendored code are left out; `security/secrets` skips the files found here, so each gives one finding; gives info instead of no finding when a dump, database or state file is over the `repo` limit in `data/thresholds.yml` or only a Git LFS pointer."
fix_hint:
  de: "Datei aus dem Repository entfernen und in .gitignore eintragen, enthaltene Schlüssel und Zugangsdaten widerrufen, die Datei aus der Git-Historie entfernen."
  en: "Remove the file from the repository and add it to .gitignore, revoke the keys and credentials it holds, and remove the file from the git history."
meta:
  last_reviewed: "2026-11-14"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://cwe.mitre.org/data/definitions/540.html
  - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository
  - https://docs.npmjs.com/cli/v10/configuring-npm/npmrc
  - https://developer.hashicorp.com/terraform/language/state/sensitive-data
