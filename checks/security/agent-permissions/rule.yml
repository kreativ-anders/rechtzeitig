# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-AGENT-003
severity: medium
title: "AI agents get no blanket permissions"
legal_basis: "CRA Art. 13(1) with Annex I Part I(2)(b), (d) and (j), secure by default, protection against unauthorised access, limited attack surface (from 11 Dec 2027); Art. 32 GDPR"
how: "Reads the committed agent config files in `data/agent-files.yml` and warns on Claude Code rules that allow every shell command (`Bash`, `Bash(*)`), `bypassPermissions`, `enableAllProjectMcpServers`, Codex with `approval_policy = \"never\"` and `danger-full-access`, MCP servers started with `npx`, `bunx`, `pnpm dlx` or `uvx` without a fixed version, remote MCP servers over `http://` outside localhost and filesystem servers given `/` or the home folder; in workflows, scripts, package.json and Dockerfiles it warns on flags that turn off every approval (`--dangerously-skip-permissions`, `--yolo`, ...); gives info instead of no finding when one of its files is over the `repo` limit in `data/thresholds.yml` or only a Git LFS pointer."
fix_hint: "Allow only the commands the agent needs (such as \"Bash(npm test)\"), skip approvals only in a sandbox or container without secrets, start MCP servers with a fixed version (npx -y package@1.2.3) and connect remote MCP servers only over https://."
meta:
  last_reviewed: "2026-11-09"
  sources:
