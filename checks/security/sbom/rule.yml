# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DEPS-002
severity: low
title: "Dependencies are locked and listed in an SBOM"
legal_basis: "CRA Annex I Part II(1) (from 11 Dec 2027)"
how: "Reads all lockfiles (`src/repo/lockfiles.ts`, up to the `repo` limit in `data/thresholds.yml`) for the SBOM the report writes to `rechtzeitig-sbom.cdx.json`, lists manifests without a lockfile in their folder or a parent folder, and never gives no finding when a lockfile gave nothing (too large, Git LFS pointer, invalid), when package files have no parser (`data/ecosystems.yml`) or when no component was found."
fix_hint: "Commit a lockfile for every manifest; keep the SBOM with each release. The CRA covers products with digital elements made available in the EU, usually not pure web services."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
