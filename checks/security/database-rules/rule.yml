# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-DBAI-001
severity: critical
title: "Database rules do not open data to everyone"
legal_basis: "Art. 32 GDPR"
how: "Splits `supabase/**/*.sql` into statements and follows `create table` in the public schema, `enable` and `disable row level security` and `drop table` in migration order, so the last statement about a table decides; looks for `if true` and test mode (`request.time < timestamp.date(...)`) in Firebase rules; gives info instead of no finding when one of its files is over the `repo` limit in `data/thresholds.yml` or only a Git LFS pointer."
fix_hint: "Enable row level security on every table and replace \"if true\" and test-mode rules with checks on the signed-in user."
meta:
  last_reviewed: "2026-11-03"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - https://supabase.com/docs/guides/database/postgres/row-level-security
  - https://firebase.google.com/docs/rules/insecure-rules
