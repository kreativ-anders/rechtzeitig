# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-CI-001
severity: high
title:
  de: "GitHub-Workflows lassen keinen fremden Code mit Rechten laufen"
  en: "GitHub workflows do not run outside code with privileges"
legal_basis:
  de: "CRA Art. 13 Abs. 1 i. V. m. Anhang I Teil I, Schutz vor unbefugtem Zugriff (ab 11.12.2027)"
  en: "CRA Art. 13(1) with Annex I Part I, protection against unauthorised access (from 11 Dec 2027)"
how: "Reads `.github/workflows/*.yml` and flags, with the patterns in `data/workflow-risks.yml`, a checkout of the pull request head under `pull_request_target` or `workflow_run`, outside-controlled `${{ }}` expressions in `run:` or `script:`, downloads piped into a shell, `write-all`, and workflows without `permissions`."
fix_hint:
  de: "Werte wie github.event.issue.title über env: an das Skript geben; unter pull_request_target keinen PR-Code auschecken; permissions: contents: read oben im Workflow setzen; Skripte herunterladen, Prüfsumme prüfen, dann ausführen."
  en: "Pass values like github.event.issue.title to the script via env:; do not check out PR code under pull_request_target; set permissions: contents: read at the top of the workflow; download scripts, verify a checksum, then run them."
meta:
  last_reviewed: "2026-11-04"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - https://docs.github.com/en/actions/reference/security/secure-use
  - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
