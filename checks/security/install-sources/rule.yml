# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: SEC-SUPPLY-003
severity: medium
title:
  de: "Pakete kommen aus prüfbaren Quellen"
  en: "Packages come from verifiable sources"
legal_basis:
  de: "CRA Art. 13 Abs. 5 (Sorgfalt bei Komponenten Dritter) i. V. m. Anhang I Teil I Nr. 2 Buchst. f (Integrität von Programmen) (ab 11.12.2027)"
  en: "CRA Art. 13(5) (due diligence for third-party components) with Annex I Part I(2)(f) (integrity of programs) (from 11 Dec 2027)"
how: "Reads the download source and hash of every package in the parsed lockfiles (`src/repo/lockfiles.ts`) and fails on sources over `http://`, warns on package-lock.json, pnpm-lock.yaml and yarn.lock entries from a registry or tarball URL without integrity hash and on git sources without a full commit; warns on git dependencies in package.json, Cargo.toml, pubspec.yaml, pyproject.toml and requirements files that name a branch, tag or nothing instead of a commit (`src/repo/manifests.ts`); checks `.npmrc`, `.yarnrc`, `.yarnrc.yml`, requirements files and pip.conf line by line, failing on `strict-ssl` off, an `http://` registry or `trusted-host`, warning on `--extra-index-url` (patterns in `data/install-sources.yml`); fixture paths are left out; gives info instead of passing when a lockfile or config could not be read."
fix_hint:
  de: "Registries und Indexe nur über https:// eintragen, strict-ssl und trusted-host entfernen (für eigene Zertifikate die CA hinterlegen), git-Abhängigkeiten auf einen vollen Commit-Hash festlegen, das Lockfile mit dem Paketmanager neu schreiben, damit jeder Eintrag einen Hash hat, und statt --extra-index-url einen Index verwenden, der interne Namen nicht an PyPI weiterreicht."
  en: "Use only https:// registries and indexes, remove strict-ssl and trusted-host (add the CA for own certificates), pin git dependencies to a full commit hash, let the package manager rewrite the lockfile so every entry has a hash, and instead of --extra-index-url use one index that does not pass internal names on to PyPI."
meta:
  last_reviewed: "2026-11-14"
  sources:
  - https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - https://docs.npmjs.com/cli/v11/configuring-npm/package-lock-json
  - https://docs.npmjs.com/cli/v11/using-npm/config
  - https://pip.pypa.io/en/stable/cli/pip_install/
  - https://cwe.mitre.org/data/definitions/494.html
