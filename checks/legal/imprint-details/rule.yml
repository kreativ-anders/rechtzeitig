id: LEG-DE-IMP-002
severity: high
title: "Imprint contains the required details"
legal_basis: "§ 5(1) DDG"
how: "Searches the imprint (linked from the start page or its hreflang version in the scan language) for email, phone or contact form (IBANs ignored), German postcode (register numbers ignored), VAT ID and register number."
fix_hint: "Give name, postal address and email address — a second fast way of contact is recommended (§ 5 Abs. 1 Nr. 2 DDG requires Angaben einschließlich der E-Mail) — plus register entry and VAT ID if you have them."
meta:
  last_reviewed: "2026-11-21"
  sources:
