id: LEG-DE-IMP-003
severity: medium
title: "Imprint and privacy policy are linked on every page"
legal_basis: "§ 5 DDG, Art. 12 GDPR"
how: "Looks for imprint and privacy links on every visited page of the site, from the load without JavaScript where the load with JavaScript failed."
