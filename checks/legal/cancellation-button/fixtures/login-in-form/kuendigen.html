<html lang="de"><body><main><h1>Mitgliedschaft kündigen</h1>
<form method="POST"><h2>Bitte füllen Sie das folgende Formular aus, um sich einzuloggen und Ihre Mitgliedschaft zu kündigen.</h2>
<label>E-Mail-Adresse oder Handynummer <input type="text" name="userLoginId"></label>
<label>Passwort <input type="password" name="password"></label>
<label>Wann soll die Kündigung in Kraft treten? <select name="immediate"><option value="endOfBillingPeriod">Ende des aktuellen Abrechnungszeitraums</option></select></label>
<button type="submit">Kündigung abschließen</button></form></main></body></html>
