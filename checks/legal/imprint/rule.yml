id: LEG-DE-IMP-001
severity: high
title: "Imprint is linked and reachable"
legal_basis: "§ 5 DDG (German Digital Services Act)"
how: "Finds the imprint link on the start page or its hreflang version in the scan language (`imprint`, link words of every language in `lang/*.yml`), loads it and checks HTTP status and that it has text."
fix_hint: "Link the imprint from every page, for example in the footer, labeled \"Impressum\"."
