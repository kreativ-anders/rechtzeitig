# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: LEG-DE-IMP-004
severity: high
title:
  de: "Impressum und Datenschutzerklärung ohne Vorlagendaten"
  en: "Imprint and privacy policy without template data"
legal_basis:
  de: "§ 5 Abs. 1 DDG; Art. 13 Abs. 1 lit. a DSGVO"
  en: "§ 5(1) DDG (German Digital Services Act); Art. 13(1)(a) GDPR"
how: "Looks for template data (`placeholder` in `lang/*.yml`: Max Mustermann, Musterstraße, Lorem ipsum, [Firmenname], example.com addresses, +49 123 456…, DE123456789) line by line in the live imprint and privacy policy and in the repository's legal page files (extensions and paths in `data/legal-texts.yml`); a live hit fails with the repository line it comes from, a hit only in the repository gives info, unread legal files keep it from passing."
fix_hint:
  de: "Die Vorlagendaten durch die echten Angaben des Anbieters ersetzen (Name, ladungsfähige Anschrift, E-Mail, Telefon, Register, USt-IdNr.) und neu veröffentlichen."
  en: "Replace the template data with the provider's real details (name, postal address, email, phone, register, VAT ID) and deploy again."
meta:
  last_reviewed: "2026-11-09"
  sources:
  - https://www.gesetze-im-internet.de/ddg/__5.html
  - https://eur-lex.europa.eu/eli/reg/2016/679/oj
