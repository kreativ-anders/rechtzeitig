# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: QUAL-STUB-001
severity: low
title: "No placeholder code in production paths"
value: "Generated code often looks finished where it only simulates. Finding placeholders shows which features are not real yet."
how: "Matches code outside tests, docs, examples and stories (languages and left-out paths in `data/code-paths.yml`), comments included, against `data/code-quality.yml`: `throw new Error(\"Not implemented\")`, `panic(\"TODO\")`, `raise NotImplementedError(\"TODO\")`, `pass  # TODO`, `TODO: implement`, elided code (`// ... rest of the code`), `// In a real app ...`, `// Simulate API call`, lorem ipsum and imports of mock data; info with the files that have most finds first; gives info instead of no finding when one of its files is over the `repo` limit in `data/thresholds.yml` or only a Git LFS pointer."
fix_hint: "Implement each find or take the feature out of the interface until it is real. Keep sample data in tests and stories."
meta:
  last_reviewed: "2026-11-09"
  sources:
