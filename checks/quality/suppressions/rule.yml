# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: QUAL-SUPPRESS-001
severity: medium
title:
  de: "Abgeschaltete Regeln sind begründet"
  en: "Turned-off rules have a reason"
value:
  de: "Eine abgeschaltete Regel bleibt im Bericht sichtbar: wer den Bericht liest, sieht, welche Regel aus ist, warum und bis wann. Ohne Begründung wäre ein grüner Lauf nichts wert."
  en: "A turned-off rule stays visible in the report: whoever reads it sees which rule is off, why and until when. Without a reason a green run would prove nothing."
how: "Reads `.github/rechtzeitig.yml` in the repository (`src/suppress.ts`) and fails for every entry without a known rule id, a category (not-applicable, false-positive, accepted-risk) or a reason, for reasons that are placeholders (`data/suppressions.yml`) or shorter than `quality/suppressions.min_reason_chars`, for an accepted risk without `expires`, for `expires` that is no real date, has passed or lies more than `max_expiry_days` ahead (`data/thresholds.yml`), for unknown fields and duplicates; such an entry turns nothing off, and a valid one turns its rule into suppressed, which still runs and shows its reason."
fix_hint:
  de: "Jedem Eintrag unter suppress eine gültige Regel-ID (rule), eine Kategorie (category: not-applicable, false-positive oder accepted-risk) und eine Begründung (reason) geben, die sagt, warum die Regel hier nicht greift. Ein akzeptiertes Risiko braucht ein Ablaufdatum (expires: JJJJ-MM-TT) innerhalb eines Jahres. Abgelaufene Einträge verlängern oder entfernen."
  en: "Give every entry under suppress a valid rule id (rule), a category (category: not-applicable, false-positive or accepted-risk) and a reason (reason) that says why the rule does not apply here. An accepted risk needs an expiry date (expires: YYYY-MM-DD) within a year. Renew or remove expired entries."
meta:
  last_reviewed: "2026-11-14"
  sources:
  - https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
