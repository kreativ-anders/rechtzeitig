# Metadata of this check. Detection lives in check.ts. Schema: src/rules.ts
id: QUAL-SUPPRESS-001
severity: medium
title: "Turned-off rules have a reason"
value: "A turned-off rule stays visible in the report: whoever reads it sees which rule is off, why and until when. Without a reason a green run would prove nothing."
how: "Reads `.github/rechtzeitig.yml` in the repository (`src/suppress.ts`) and fails for every entry without a known rule id, a category (not-applicable, false-positive, accepted-risk) or a reason, for reasons that are placeholders (`data/suppressions.yml`) or shorter than `quality/suppressions.min_reason_chars`, for an accepted risk without `expires`, for `expires` that is no real date, lies in the past or more than `max_expiry_days` ahead (`data/thresholds.yml`), for unknown fields and duplicates; such an entry turns nothing off, and a valid one turns its rule into suppressed, which still runs and shows its reason."
fix_hint: "Give every entry under suppress a valid rule id (rule), a category (category: not-applicable, false-positive or accepted-risk) and a reason (reason) that says why the rule does not apply here. An accepted risk needs an expiry date (expires: YYYY-MM-DD) within a year. Renew or remove expired entries."
meta:
  last_reviewed: "2026-11-14"
  sources:
  - https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html
