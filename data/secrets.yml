# Patterns for secrets in tracked files (repo/secrets).
# payload (optional): decode match group 1 as a JWT payload; the rule matches only when every listed claim has this value.
# severity: fail = almost certainly a real secret, warn = may be meant to be public (for example a restricted browser key).

- name: Private key
  pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
  severity: fail
- name: AWS access key
  pattern: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
  severity: fail
- name: Stripe secret key
  pattern: '\b(sk|rk)_live_[0-9a-zA-Z]{20,}'
  severity: fail
- name: GitHub token
  pattern: '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{50,}'
  severity: fail
- name: Anthropic API key
  pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}'
  severity: fail
- name: OpenAI API key
  pattern: '\bsk-(proj-)?[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}|\bsk-proj-[A-Za-z0-9_-]{40,}'
  severity: fail
- name: Slack token
  pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}'
  severity: fail
- name: SendGrid API key
  pattern: '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'
  severity: fail
- name: Google API key
  pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
  severity: warn
- name: Secret under a public prefix (ends up in the browser bundle)
  pattern: '\b(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|NUXT_PUBLIC|GATSBY|PUBLIC)_[A-Z0-9_]*(SECRET|PRIVATE|SERVICE_ROLE|PASSWORD)[A-Z0-9_]*\b'
  severity: fail
- name: Supabase service_role key
  pattern: '\beyJ[A-Za-z0-9_-]{10,}\.(eyJ[A-Za-z0-9_-]{10,})\.[A-Za-z0-9_-]{10,}'
  payload:
    role: service_role
  severity: fail
