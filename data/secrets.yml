# Patterns for secrets in tracked files (security/secrets).
#
# Many patterns are adapted from the default config of gitleaks (config/gitleaks.toml,
# https://github.com/gitleaks/gitleaks), Copyright (c) 2019 Zachary Rice, MIT License; see NOTICE.
# They were rewritten for JavaScript regular expressions and checked against src/patterns.test.ts.
#
# rules:
#   name: shown in the finding.
#   pattern: JavaScript regular expression, matched per line. A group named `secret` is the part
#     the entropy test and the placeholder words look at; without it, the whole match.
#   keywords (optional): lowercase strings; the pattern only runs on a line that contains one of them.
#   entropy (optional): `token` or `generic`, the minimum Shannon entropy in bits per character
#     from data/thresholds.yml `security/secrets.entropy`. Drops placeholders like sk_live_xxxxxxxx.
#   allow (optional): regular expression; a find that matches it is a documented example, not a secret.
#   payload (optional): decode match group 1 as a JWT payload; the rule matches only when every listed claim has this value.
#   severity: fail = almost certainly a real secret, warn = may be meant to be public or may be a false positive.
#
# placeholders: lowercase words that mark a find as an example (gitleaks calls them stopwords).
#   A find of a rule with `entropy` whose `secret` contains one of them is dropped.

placeholders:
  - example
  - sample
  - placeholder
  - dummy
  - changeme
  - change_me
  - your_
  - your-
  - yourkey
  - xxxxxx
  - "000000"
  - "123456"
  - abcdef
  - redacted
  - insert
  - replace

rules:
  # Keys and certificates
  - name: Private key
    pattern: '-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'
    keywords: ["-----begin"]
    severity: fail
  - name: age secret key
    pattern: 'AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'
    keywords: ["age-secret-key-1"]
    severity: fail

  # Cloud
  - name: AWS access key
    pattern: '\b(?<secret>(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'
    keywords: [akia, asia, abia, acca, a3t]
    entropy: token
    allow: 'EXAMPLE$'
    severity: fail
  - name: Azure AD client secret
    pattern: '(?:^|[\\''"`\s>=:(,)])(?<secret>[a-zA-Z0-9_~.]{3}\dQ~[a-zA-Z0-9_~.-]{31,34})(?:$|[\\''"`\s<),])'
    keywords: ["q~"]
    entropy: token
    severity: fail
  - name: Google API key
    pattern: '\b(?<secret>AIza[0-9A-Za-z_-]{35})(?![0-9A-Za-z_-])'
    keywords: [aiza]
    entropy: token
    severity: warn
  - name: DigitalOcean token
    pattern: '\b(?<secret>do[opr]_v1_[a-f0-9]{64})\b'
    keywords: [_v1_]
    entropy: token
    severity: fail
  - name: Databricks token
    pattern: '\b(?<secret>dapi[a-f0-9]{32}(?:-\d)?)\b'
    keywords: [dapi]
    entropy: token
    severity: fail
  - name: HashiCorp Vault token
    pattern: '\b(?<secret>hvs\.[\w-]{90,120})(?![\w-])'
    keywords: [hvs.]
    entropy: token
    severity: fail
  - name: Terraform Cloud token
    pattern: '\b[a-zA-Z0-9]{14}\.atlasv1\.(?<secret>[a-zA-Z0-9_=-]{60,70})\b'
    keywords: [atlasv1]
    entropy: token
    severity: fail
  - name: Pulumi token
    pattern: '\b(?<secret>pul-[a-f0-9]{40})\b'
    keywords: [pul-]
    entropy: token
    severity: fail
  - name: Doppler token
    pattern: '\bdp\.pt\.(?<secret>[a-zA-Z0-9]{43})\b'
    keywords: [dp.pt.]
    entropy: token
    severity: fail

  # Databases and backends often used by generated apps
  - name: Supabase service_role key
    # Starts only where no token character precedes it. With \b, every "-eyJ" inside one long run of
    # token characters started a new attempt that read to the end of the run (quadratic on minified files).
    pattern: '(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{10,}\.(eyJ[A-Za-z0-9_-]{10,})\.[A-Za-z0-9_-]{10,}'
    keywords: [eyj]
    payload:
      role: service_role
    severity: fail
  - name: Supabase secret key
    pattern: '\b(?<secret>sb_secret_[A-Za-z0-9_-]{20,})'
    keywords: [sb_secret_]
    entropy: token
    severity: fail
  - name: PlanetScale token or password
    pattern: '\b(?<secret>pscale_(?:tkn|pw|oauth)_[\w=.-]{32,64})(?![\w=.-])'
    keywords: [pscale_]
    entropy: token
    severity: fail

  # Payment and shops
  - name: Stripe secret key
    pattern: '\b(?<secret>(?:sk|rk)_live_[0-9a-zA-Z]{20,})'
    keywords: [sk_live_, rk_live_]
    entropy: token
    severity: fail
  - name: Square access token
    pattern: '\b(?<secret>(?:EAAA|sq0atp-)[\w-]{22,60})(?![\w-])'
    keywords: [eaaa, sq0atp-]
    entropy: token
    severity: fail
  - name: Shopify token or secret
    pattern: '\b(?<secret>shp(?:at|ca|pa|ss)_[a-fA-F0-9]{32})\b'
    keywords: [shpat_, shpca_, shppa_, shpss_]
    entropy: token
    severity: fail

  # AI providers
  - name: Anthropic API key
    pattern: '\b(?<secret>sk-ant-[A-Za-z0-9_-]{20,})'
    keywords: [sk-ant-]
    entropy: token
    severity: fail
  - name: OpenAI API key
    pattern: '\b(?<secret>sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,74}T3BlbkFJ[A-Za-z0-9_-]{20,74}|sk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,})'
    keywords: [t3blbkfj, sk-proj-, sk-svcacct-, sk-admin-]
    entropy: token
    severity: fail
  - name: Hugging Face token
    pattern: '\b(?<secret>hf_[a-zA-Z]{34})\b'
    keywords: [hf_]
    entropy: token
    severity: fail
  - name: Perplexity API key
    pattern: '\b(?<secret>pplx-[a-zA-Z0-9]{48})\b'
    keywords: [pplx-]
    entropy: token
    severity: fail

  # Code hosting and package registries
  - name: GitHub token
    pattern: '\b(?<secret>(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36})\b|\b(?<secret>github_pat_[A-Za-z0-9_]{50,})'
    keywords: [ghp_, gho_, ghu_, ghs_, ghr_, github_pat_]
    entropy: token
    severity: fail
  - name: GitLab token
    pattern: '\b(?<secret>(?:glpat|gldt|glrt|gloas|glft|glsoat)-[\w-]{20,})|\b(?<secret>glptt-[0-9a-f]{40})|\b(?<secret>GR1348941[\w-]{20})'
    keywords: [glpat-, gldt-, glrt-, gloas-, glft-, glsoat-, glptt-, gr1348941]
    entropy: token
    severity: fail
  - name: npm access token
    pattern: '\b(?<secret>npm_[a-zA-Z0-9]{36})\b'
    keywords: [npm_]
    entropy: token
    severity: fail
  - name: PyPI upload token
    pattern: '\bpypi-AgEIcHlwaS5vcmc[\w-]{50,1000}'
    keywords: [pypi-ageichlwas5vcmc]
    severity: fail
  - name: RubyGems API key
    pattern: '\b(?<secret>rubygems_[a-f0-9]{48})\b'
    keywords: [rubygems_]
    entropy: token
    severity: fail

  # Chat, mail and messaging
  - name: Slack token
    pattern: '\b(?<secret>xox[baprse]-[A-Za-z0-9-]{10,}|xapp-\d-[A-Z0-9]+-\d+-[a-z0-9]+)'
    keywords: [xoxb-, xoxa-, xoxp-, xoxr-, xoxs-, xoxe-, xapp-]
    entropy: token
    severity: fail
  - name: Slack webhook
    pattern: '\bhooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9+/]{43,56}'
    keywords: [hooks.slack.com]
    severity: fail
  - name: Microsoft Teams webhook
    pattern: '\b[a-z0-9]+\.webhook\.office\.com/webhookb2/[a-z0-9-]{36}@[a-z0-9-]{36}/IncomingWebhook/[a-z0-9]{32}/[a-z0-9-]{36}'
    keywords: [webhook.office.com]
    severity: fail
  - name: Discord webhook
    pattern: '\bdiscord(?:app)?\.com/api/webhooks/\d{17,20}/[\w-]{60,68}'
    keywords: [discord]
    severity: fail
  - name: Telegram bot token
    pattern: '[Tt][Ee][Ll][Ee][Gg][Rr][\w.-]{0,20}[\s''"]{0,3}(?:=|:|=>|,)[`''"\s=]{0,5}(?<secret>[0-9]{5,16}:A[a-zA-Z0-9_-]{34})(?![\w-])'
    keywords: [telegr]
    entropy: token
    severity: fail
  - name: SendGrid API key
    pattern: '\b(?<secret>SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43})(?![A-Za-z0-9_-])'
    keywords: [sg.]
    entropy: token
    severity: fail
  - name: Brevo (Sendinblue) API key
    pattern: '\b(?<secret>xkeysib-[a-f0-9]{64}-[a-zA-Z0-9]{16})\b'
    keywords: [xkeysib-]
    entropy: token
    severity: fail
  - name: Mailgun API key
    pattern: '[Mm][Aa][Ii][Ll][Gg][Uu][Nn][\w.-]{0,20}[\s''"]{0,3}(?:=|:|=>|,)[`''"\s=]{0,5}(?<secret>key-[a-f0-9]{32})\b'
    keywords: [mailgun]
    entropy: token
    severity: fail
  - name: Twilio API key
    pattern: '\b(?<secret>SK[0-9a-fA-F]{32})\b'
    keywords: [sk]
    entropy: token
    severity: fail

  # Developer SaaS
  - name: Linear API key
    pattern: '\b(?<secret>lin_api_[a-zA-Z0-9]{40})\b'
    keywords: [lin_api_]
    entropy: token
    severity: fail
  - name: Postman API key
    pattern: '\b(?<secret>PMAK-[a-fA-F0-9]{24}-[a-fA-F0-9]{34})\b'
    keywords: [pmak-]
    entropy: token
    severity: fail
  - name: Sentry token
    pattern: '\b(?<secret>sntryu_[a-f0-9]{64})\b'
    keywords: [sntryu_]
    entropy: token
    severity: fail
  - name: Grafana service account token
    pattern: '\b(?<secret>glsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8})\b'
    keywords: [glsa_]
    entropy: token
    severity: fail

  # Mistakes in the project's own configuration
  - name: Secret under a public prefix (ends up in the browser bundle)
    pattern: '\b(NEXT_PUBLIC|VITE|EXPO_PUBLIC|REACT_APP|NUXT_PUBLIC|GATSBY|PUBLIC)_[A-Z0-9_]*(SECRET|PRIVATE|SERVICE_ROLE|PASSWORD)[A-Z0-9_]*\b'
    keywords: [next_public, vite_, expo_public, react_app, nuxt_public, gatsby_, public_]
    severity: fail
  # Idea from detect-secrets (keyword detector with an entropy filter), written for this project.
  # A name with secret, password, token or api key, assigned a quoted or unquoted value without spaces.
  - name: Possible secret in an assignment
    pattern: '(?<![\w.-])[\w.-]{0,40}?(?:[Ss][Ee][Cc][Rr][Ee][Tt]|[Pp][Aa][Ss][Ss][Ww](?:[Oo][Rr])?[Dd]|[Tt][Oo][Kk][Ee][Nn]|[Aa][Pp][Ii]_?[Kk][Ee][Yy]|PRIVATE_KEY)[\w-]{0,20}["'']?\s{0,3}(?::=|=>|=|:)\s{0,3}(?<q>["''`]?)(?<secret>[A-Za-z0-9+/=_.~!@#%^*-]{16,200})\k<q>(?=$|[\s,;)}])'
    keywords: [secret, passw, token, api_key, apikey]
    entropy: generic
    allow: '^[A-Za-z_.-]+$'
    severity: warn
