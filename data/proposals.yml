# Legislative proposals with their own check group: the rules of proposal `dfa` live in checks/dfa/. A proposal is no
# law: its rules have no legal_basis but a `value` that starts with the proposal's title and names the article.
#
# status:   proposal | adopted | in force | applies
# checked:  last day someone compared status and articles with the source. A test fails when it is older than
#           proposals.max_age_days in data/thresholds.yml, because the text changes during the negotiations.
# applies:  first day the law applies, once known
# sources:  official documents of the proposal.
# When a proposal applies, its rules get a legal_basis instead of `value`.

