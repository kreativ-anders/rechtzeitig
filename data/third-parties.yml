# Known third-party services.
#
# hosts:   a request to this host or any subdomain belongs to the vendor
# consent: required = must not load before consent (tracking, ads, embeds, fonts)
#          check    = needs a legal basis, consent is not always necessary (CDN, payment, security)
# names:   how a privacy policy would mention the vendor (default: name)
# cookies: regular expressions for the vendor's cookie names
# advice:  shown in the report

- name: Google Fonts
  hosts: [fonts.googleapis.com, fonts.gstatic.com]
  purpose: fonts
  consent: required
  names: [google fonts]
  advice: Host the fonts yourself, for example with @fontsource. LG München I, 20.01.2022, 3 O 17493/20.

- name: Adobe Fonts
  hosts: [use.typekit.net, p.typekit.net]
  purpose: fonts
  consent: required
  names: [adobe fonts, typekit]
  advice: Host the fonts yourself if the license allows it.

- name: Font Awesome
  hosts: [kit.fontawesome.com, use.fontawesome.com, ka-f.fontawesome.com]
  purpose: fonts
  consent: required
  advice: Install Font Awesome as a package and serve it from your own server.

- name: Google Analytics
  hosts: [google-analytics.com, analytics.google.com]
  purpose: analytics
  consent: required
  cookies: ['^_ga', '^_gid$', '^_gat']

- name: Google Tag Manager
  hosts: [googletagmanager.com]
  purpose: tag manager
  consent: required
  names: [google tag manager, tag manager]

- name: Google Ads
  hosts: [doubleclick.net, googleadservices.com, googlesyndication.com, googletagservices.com]
  purpose: advertising
  consent: required
  names: [google ads, adsense, doubleclick]
  cookies: ['^_gcl_', '^IDE$', '^test_cookie$']

- name: YouTube
  hosts: [youtube.com, youtube-nocookie.com, ytimg.com, googlevideo.com]
  purpose: video
  consent: required
  advice: Show a preview image and load the video only after a click.
  cookies: ['^VISITOR_INFO1_LIVE$', '^YSC$']

- name: Vimeo
  hosts: [vimeo.com, vimeocdn.com]
  purpose: video
  consent: required
  advice: Show a preview image and load the video only after a click.

- name: Google Maps
  hosts: [maps.googleapis.com, maps.gstatic.com]
  purpose: maps
  consent: required
  names: [google maps]
  advice: Show a static image or a link and load the map only after a click.

- name: Mapbox
  hosts: [mapbox.com]
  purpose: maps
  consent: required

- name: OpenStreetMap
  hosts: [tile.openstreetmap.org]
  purpose: maps
  consent: required
  names: [openstreetmap]
  advice: Load the map after a click, or serve tiles from your own server.

- name: Google (gstatic, reCAPTCHA)
  hosts: [www.gstatic.com, www.google.com, recaptcha.net]
