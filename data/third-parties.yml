# Known third-party services.
#
# hosts:   a request to this host or any subdomain belongs to the vendor
# consent: required = must not load before consent (tracking, ads, embeds, fonts)
#          check    = needs a legal basis, consent is not always necessary (CDN, payment, security)
# country: ISO code of the group that processes the data. A US group counts as US even when
#          an EU subsidiary is the contract partner, because data can reach the parent company.
# names:   how a privacy policy would mention the vendor (default: name)
# cookies: regular expressions for the vendor's cookie names
# packages: npm packages of the vendor's SDK; a trailing * matches a prefix. Compared with the
#          privacy policy by privacy/sdks-in-privacy-policy.
# advice:  shown in the report, one text per report language (de, en)

- name: Google Fonts
  hosts: [fonts.googleapis.com, fonts.gstatic.com]
  purpose: fonts
  consent: required
  country: US
  names: [google fonts]
  advice:
    de: "Schriften selbst hosten, zum Beispiel mit @fontsource. LG München I, 20.01.2022, 3 O 17493/20."
    en: "Host the fonts yourself, for example with @fontsource. LG München I, 20.01.2022, 3 O 17493/20."

- name: Adobe Fonts
  hosts: [use.typekit.net, p.typekit.net]
