  consent: required
  country: US
  names: [adobe fonts, typekit]
  advice:
    de: "Schriften selbst hosten, wenn die Lizenz es erlaubt."
    en: "Host the fonts yourself if the license allows it."

- name: Font Awesome
  hosts: [kit.fontawesome.com, use.fontawesome.com, ka-f.fontawesome.com]
