# Numbers checks decide by, in one place. One section per check (its path under checks/), plus `common`,
# `repo` (reading the repository) and `axe` (accessibility tests in the browser).
# Changing a value changes results: mention it in the commit message.

common:
  # Longest list of items in one finding; the rest is counted as "and N more" (capped() in src/sdk.ts).
  max_listed: 20

# Reading the repository (src/repo/scan.ts). Files above a limit are not read; the report names them.
repo:
  # Largest file any repository check reads, in bytes, for example repo/secrets.
  max_file_bytes: 1000000
  # Largest lockfile read (names in src/repo/lockfiles.ts). Lockfiles of large projects pass 1 MB.
  max_lockfile_bytes: 50000000

# axe-core on the JavaScript load of each page (src/capture.ts, rules in data/accessibility.yml).
axe:
  # Longest time axe-core may run on one page, in milliseconds, at most the page timeout. A page that takes longer gets no
  # accessibility results, and the accessibility checks skip it.
  timeout_ms: 10000
  # Elements kept per axe rule and page; the count of all of them is kept as well.
  max_targets: 20
# Served code the crawler keeps (src/capture.ts, src/probe.ts): documents and scripts of the load with JavaScript,
# once per URL, for checks that read the bundle (security/secrets-in-bundle, security/database-live).
code:
  # Longer bodies are cut at this many characters; the check says so.
  max_file_chars: 3000000
  # Documents and scripts kept per scan; the rest is counted as not read.
  max_files: 40
  # Source maps requested per scan (security/source-maps), each read up to max_file_chars.
  max_maps: 5

# Reject button less prominent than the accept button. The authorities set no fixed numbers
# (DSK OH Telemedien Rn. 125, EDPB Cookie Banner Taskforce Rn. 17), so these only flag clear cases.
privacy/consent-equal-choice:
  # Reject is smaller when its rendered area is below this share of the accept button's area.
  min_area_ratio: 0.5
  # Reject is smaller when its font size is below this share of the accept button's font size.
  min_font_ratio: 0.8
  # WCAG contrast ratio of text against background (https://www.w3.org/TR/WCAG21/#contrast-minimum).
  # Reject is harder to read when the accept text reaches `readable` and the reject text stays below `low`.
  contrast:
    readable: 4.5
    low: 3

privacy/cookie-lifetime:
  # Longest lifetime of a cookie that needs consent: 13 months, as the CNIL recommends for audience
  # measurement cookies (recommendation 2020-092, Art. 5), counted as the longest 13 calendar months.
  # Chrome caps cookies at 400 days, so the limit must stay below 400.
  max_days: 397

security/secrets:
  # Minimum Shannon entropy in bits per character of a find, for rules in data/secrets.yml with `entropy`.
  # Values as in gitleaks: 3 for tokens with a fixed prefix, 3.5 for the generic assignment rule.
  # A random hex string reaches about 3.7, base64 about 4.5 to 5; sk_live_xxxxxxxxxxxx stays near 2.
  entropy:
    token: 3
    generic: 3.5

security/tls:
  # Warn when the certificate expires in fewer days than this.
  warn_days: 14

sustainability/compression:
  # Answers with a Content-Length below this are left out: compression barely saves anything there.
  min_bytes: 1024

sustainability/content-without-js:
  # Warn when less than this share of the visible text is shown without JavaScript.
  min_share: 0.2

sustainability/lazy-loading:
  # Images smaller than this in width or height (CSS pixels) are ignored: tracking pixels, icons.
  min_size: 50

security/source-maps:
  # A source path matches a repository file only by an ending of at least this many parts (src/app.ts),
  # since a bare file name (index.ts) matches too many files.
  min_parts: 2
