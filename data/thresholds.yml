# Numbers checks decide by, in one place. One section per check (its path under checks/), plus `common`.
# Changing a value changes results: mention it in the commit message.

common:
  # Longest list of items in one finding; the rest is counted as "and N more" (capped() in src/sdk.ts).
  max_listed: 20

# Reject button less prominent than the accept button. The authorities set no fixed numbers
# (DSK OH Telemedien Rn. 125, EDPB Cookie Banner Taskforce Rn. 17), so these only flag clear cases.
privacy/consent-equal-choice:
  # Reject is smaller when its rendered area is below this share of the accept button's area.
  min_area_ratio: 0.5
  # Reject is smaller when its font size is below this share of the accept button's font size.
  min_font_ratio: 0.8
  # WCAG contrast ratio of text against background (https://www.w3.org/TR/WCAG21/#contrast-minimum).
  # Reject is harder to read when the accept text reaches `readable` and the reject text stays below `low`.
  contrast:
    readable: 4.5
    low: 3

privacy/cookie-lifetime:
  # Longest lifetime of a cookie that needs consent: 13 months, as the CNIL recommends for audience
  # measurement cookies (recommendation 2020-092, Art. 5), counted as the longest 13 calendar months.
  # Chrome caps cookies at 400 days, so the limit must stay below 400.
  max_days: 397

security/tls:
  # Warn when the certificate expires in fewer days than this.
  warn_days: 14

sustainability/compression:
  # Answers with a Content-Length below this are left out: compression barely saves anything there.
  min_bytes: 1024

sustainability/content-without-js:
  # Warn when less than this share of the visible text is shown without JavaScript.
  min_share: 0.2

sustainability/lazy-loading:
  # Images smaller than this in width or height (CSS pixels) are ignored: tracking pixels, icons.
  min_size: 50
