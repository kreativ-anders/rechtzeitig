# Domains a rule may cite in meta.sources. Only primary sources: laws, courts, authorities,
# standards bodies, and a vendor's own documentation for technical facts about that vendor.
# Blogs, law firm articles and private sites may help to find a source, but are never cited.
# A new domain needs a reason in the commit message. Subdomains count (www.example.org matches example.org).

# Laws and official journals.
law:
  - eur-lex.europa.eu
  - gesetze-im-internet.de
  - gesetze-bayern.de
  - recht.nrw.de

# Courts.
courts:
  - curia.europa.eu
  - bundesgerichtshof.de
  - bundesverfassungsgericht.de
  - rechtsprechung-im-internet.de
  - justiz.nrw.de

# Authorities and official bodies.
authorities:
  - edpb.europa.eu
  - enisa.europa.eu
  - nvd.nist.gov
  - commission.europa.eu
  - digital-strategy.ec.europa.eu
  - datenschutzkonferenz-online.de
  - bfdi.bund.de
  - cnil.fr
  - bsi.bund.de
  - bundesnetzagentur.de
  - bundesfachstelle-barrierefreiheit.de

# Standards and specifications.
standards:
  - w3.org
  - whatwg.org
  - etsi.org
  - rfc-editor.org
  - cyclonedx.org
  - spdx.org
  - tc39.es
  - unicode.org
  - modelcontextprotocol.io

# License stewards: the texts and official FAQs of the licenses they publish.
licenses:
  - gnu.org
  - opensource.org
  - apache.org

# Vendor documentation, only for technical facts about that vendor's product.
vendors:
  - osv.dev
  - supabase.com
  - firebase.google.com
  - developers.google.com
  - support.google.com
  - docs.github.com
  - hstspreload.org
  - thegreenwebfoundation.org
  - code.claude.com
  - docs.npmjs.com
  - doc.rust-lang.org
  - llama.com
  - ai.google.dev

# Weakness catalogues and secure coding guides, for rules on code patterns.
weaknesses:
  - cwe.mitre.org
  - owasp.org

# Framework and SDK documentation, only for technical facts about that framework or SDK.
frameworks:
  - nodejs.org
  - docs.djangoproject.com
  - flask.palletsprojects.com
  - laravel.com
  - guides.rubyonrails.org
  - apollographql.com
  - nextjs.org
  - vite.dev
  - platform.openai.com
  - docs.stripe.com
  - jestjs.io

# Published research with its own data, for quality rules (no legal basis) that cite how often a problem occurs.
research:
  - arxiv.org
  - metr.org
  - anthropic.com
