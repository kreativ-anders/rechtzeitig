# Real packages one typo away from a popular name. Never flagged.
known:
  npm: [dotenvx]
  pypi: [jinja]
  cargo: []
  composer: []
  pub: []

# Lockfiles of each package manager, per ecosystem family. Two managers' lockfiles in one folder
# mean the installs differ depending on who runs which tool.
managers:
  npm:
    npm: [package-lock.json, npm-shrinkwrap.json]
    pnpm: [pnpm-lock.yaml]
    yarn: [yarn.lock]
    bun: [bun.lock, bun.lockb]
  pypi:
    uv: [uv.lock]
    poetry: [poetry.lock]
    pdm: [pdm.lock]
    pipenv: [Pipfile.lock]

# Python lockfiles that lock pyproject.toml. requirements*.txt often lists only part of the dependencies,
# so it does not count here.
python_lockfiles: [uv.lock, poetry.lock]

# Composer requirements that are platform packages, not packages from a registry.
composer_platform: '^(php(-64bit|-ipv6|-zts|-debug)?|hhvm|composer|composer-plugin-api|composer-runtime-api|ext-.+|lib-.+)$'

# npm dependency specs that do not name a version from the registry: local, git, URL, alias, workspace.
npm_non_registry: '^(workspace:|file:|link:|portal:|patch:|exec:|git\+|git:|github:|gitlab:|bitbucket:|gist:|https?:|npm:|jsr:|catalog:|\.|/|~/)|^[^@\s/][^\s]*/[^\s]+$'
