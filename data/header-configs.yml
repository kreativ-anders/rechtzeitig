# Security headers compared between hosting config in the repository and the live start page
# (security/headers-deployed). Other headers in the config are left out: hosts and CDNs often change them.
#
# headers: names compared, lowercase.
# meta:    names whose <meta> equivalent counts as sent, because browsers apply it (CSP, referrer).

headers:
  - content-security-policy
  - content-security-policy-report-only
  - strict-transport-security
  - x-frame-options
  - x-content-type-options
  - referrer-policy
  - permissions-policy
  - cross-origin-opener-policy
  - cross-origin-embedder-policy
  - cross-origin-resource-policy
meta: [content-security-policy, referrer-policy]
