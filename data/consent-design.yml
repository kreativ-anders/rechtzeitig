# Thresholds for privacy/consent-equal-choice: when a reject button counts as less prominent than
# the accept button in a consent banner. The authorities set no fixed numbers (DSK OH Telemedien
# Rn. 125, EDPB Cookie Banner Taskforce Rn. 17), so these only flag clear cases for a human to look at.

# Reject is smaller when its rendered area is below this share of the accept button's area.
min_area_ratio: 0.5

# Reject is smaller when its font size is below this share of the accept button's font size.
min_font_ratio: 0.8

# WCAG contrast ratio of text against background (https://www.w3.org/TR/WCAG21/#contrast-minimum).
# Reject is harder to read when the accept text reaches `readable` and the reject text stays below `low`.
contrast:
  readable: 4.5
  low: 3
