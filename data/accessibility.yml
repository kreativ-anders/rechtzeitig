# axe-core rules that src/capture.ts runs on the JavaScript load of every visited page, per check.
# Rule ids: https://github.com/dequelabs/axe-core/blob/develop/doc/rule-descriptions.md
#
# Rules that map to one WCAG 2.1 success criterion (EN 301 549 clause 9.x) and rarely flag
# something that is fine. Best practices from WAI-ARIA and HTML without a WCAG criterion go only
# into accessibility/best-practices, which names no legal basis. Not a full axe-core run: rules
# that need a person to judge and experimental rules stay out. Only violations count, never
# axe's "incomplete". A new id here runs on the next scan; it must belong to one check below.

rules:
  # WCAG 1.1.1 Non-text content
  accessibility/alt-text: [image-alt, input-image-alt, role-img-alt, area-alt, svg-img-alt]
  # WCAG 4.1.2 Name, role, value: form fields
  accessibility/form-labels: [label, select-name, aria-input-field-name]
  # WCAG 4.1.2 Name, role, value and 2.4.4 Link purpose: buttons, links, frames
  accessibility/control-names: [button-name, input-button-name, link-name, frame-title]
  # WCAG 1.3.1 Info and relationships: ARIA roles and lists with the children and parents they need
  accessibility/aria-structure: [aria-required-children, aria-required-parent, list, listitem]
  # WCAG 4.1.2 Name, role, value: ARIA attributes that exist and have a valid value
  accessibility/aria-attributes: [aria-valid-attr, aria-valid-attr-value]
  # WCAG 1.4.3 Contrast (minimum)
  accessibility/contrast: [color-contrast]
  # No WCAG criterion: WAI-ARIA and HTML best practices (landmarks, dialog names, live regions, aria-hidden)
  accessibility/best-practices:
    [landmark-no-duplicate-banner, landmark-no-duplicate-main, aria-dialog-name, rechtzeitig-aria-hidden-false, rechtzeitig-live-region]

# Own rules for what axe-core has no rule for, run by axe-core like its own: every element that
# matches the CSS selector is a violation, hidden elements included. Each id must be listed above.
custom:
  # aria-hidden="false" works differently across browsers and screen readers (WAI-ARIA 1.2, aria-hidden).
  rechtzeitig-aria-hidden-false: '[aria-hidden="false"]'
  # Live regions: explicit aria-live and the roles with an implicit one (WAI-ARIA 1.2, 6.3.6).
  # The check counts them per page against data/thresholds.yml.
  rechtzeitig-live-region: '[aria-live="polite"], [aria-live="assertive"], [role~="alert"], [role~="log"], [role~="status"], [role~="marquee"], [role~="timer"], output'
